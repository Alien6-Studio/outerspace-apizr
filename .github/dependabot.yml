version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      action-updates:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/scripts/client_collection_tools"
    schedule:
      interval: weekly
    groups:
      client-tooling:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: "/"
    target-branch: gh-pages
    schedule:
      interval: weekly
    groups:
      website-tooling:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: gh-pages
    schedule:
      interval: monthly
    groups:
      website-actions:
        patterns: ["*"]
