name: Attest delivery plugin

on:
  push:
    branches: ['0.4.6']
  pull_request:
  workflow_dispatch:

# Supersede only earlier runs for the same PR. Other events get unique groups,
# so even pending manual, push and scheduled qualifications cannot cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml

  delivery-receipts:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.product != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Optional plugin coverage
        run: uv run --locked pytest tests/attest_plugin --cov=apizr_attest --cov-report=term-missing --cov-report=json:attest-coverage.json --junitxml=attest-tests.xml
      - name: Signed delivery, OCI artifacts and isolated read-only consumer
        run: python3 scripts/smoke_oci_registry.py --artifacts --output "$RUNNER_TEMP/attest-delivery-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: attest-delivery-proof
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: |
            attest-coverage.json
            attest-tests.xml
            ${{ runner.temp }}/attest-delivery-proof
