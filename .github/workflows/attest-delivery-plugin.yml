name: Attest delivery plugin

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Optional plugin coverage
        run: uv run --locked pytest tests/attest_plugin --cov=apizr_attest --cov-report=term-missing --cov-report=json:attest-coverage.json --junitxml=attest-tests.xml
      - name: Signed delivery, OCI artifacts and isolated read-only consumer
        run: python3 scripts/smoke_oci_registry.py --artifacts --output "$RUNNER_TEMP/attest-delivery-proof"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: attest-delivery-proof
          retention-days: 90
          if-no-files-found: error
          path: |
            attest-coverage.json
            attest-tests.xml
            ${{ runner.temp }}/attest-delivery-proof
