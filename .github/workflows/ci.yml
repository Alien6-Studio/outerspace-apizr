name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - run: uv run --locked pre-commit run --all-files

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest --cov --cov-report=term-missing
      - run: uv run --locked coverage report --include='src/apizr/capabilities/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/readiness/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/generators/rest/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/generators/mcp/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/interfaces/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/execution/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/governed/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/repository/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/graph/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/repository_readiness/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/readiness_cli.py,src/apizr/repository_readiness_cli.py,src/apizr/repository_cli.py' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/execution/worker.py,src/apizr/execution/supervisor.py,src/apizr/execution/protocol.py' --fail-under=90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv build
      - run: uv run --locked python scripts/check_distribution.py dist --manifest SHA256SUMS.json
      - run: uv run --locked python scripts/smoke_wheel.py dist/*.whl
      - name: Check the same wheel on the oldest supported Python
        run: uv run --locked python scripts/smoke_wheel.py dist/*.whl --python 3.11
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-checksums
          path: SHA256SUMS.json
          if-no-files-found: error
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      # Generate once per target: verifies target-specific dependency resolution in Docker.
      - run: uv run --locked python scripts/smoke_container.py --python-version "${{ matrix.python }}"

  oci-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
      # systemd scope GC can discard OOM evidence before containerd reads it:
      # https://github.com/containerd/containerd/pull/12819
      # Keep every assertion; use the cgroupfs driver on this disposable runner.
      - name: Configure reliable Docker OOM evidence on the test runner
        run: |
          docker info --format 'Docker={{.ServerVersion}} cgroup_driver={{.CgroupDriver}} cgroup_version={{.CgroupVersion}}'
          sudo python3 - <<'PYCONFIG'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          options = config.get("exec-opts", [])
          config["exec-opts"] = [option for option in options if not option.startswith("native.cgroupdriver=")]
          config["exec-opts"].append("native.cgroupdriver=cgroupfs")
          path.write_text(json.dumps(config) + "\n")
          PYCONFIG
          sudo systemctl restart docker
          docker info --format 'Docker={{.ServerVersion}} cgroup_driver={{.CgroupDriver}} cgroup_version={{.CgroupVersion}}'
          test "$(docker info --format '{{.CgroupDriver}}')" = cgroupfs
      - run: uv sync --locked
      - run: uv build
      - name: Deliberately build local fixture worker image
        run: uv run --locked python scripts/build_worker_image.py dist/*.whl --output /tmp/apizr-worker-image.json
      - name: Exercise actual Linux container boundaries
        env:
          APIZR_TEST_OCI_IMAGE: /tmp/apizr-worker-image.json
        run: uv run --locked pytest tests/oci tests/governed_oci --cov=apizr.oci --cov=apizr.governed_oci --cov-report=term-missing --cov-fail-under=90 -k "not repeated"
      - name: Every repeated OOM, ordinary failure and timeout sample must pass
        env:
          APIZR_TEST_OCI_IMAGE: /tmp/apizr-worker-image.json
        run: uv run --locked pytest tests/oci tests/governed_oci -k repeated --cov=apizr.oci --cov=apizr.governed_oci --cov-append --cov-report=term-missing --cov-fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/oci/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/oci/docker.py,src/apizr/oci/provider.py,src/apizr/oci/supervisor.py' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/governed_oci/*' --fail-under=90
      - name: Installed wheel supports explicit OCI execution
        run: uv run --locked python scripts/smoke_wheel.py dist/*.whl --runtime-image-config /tmp/apizr-worker-image.json
      - name: Assert no invocation containers remain
        if: always()
        run: test -z "$(docker ps -aq --filter label=org.apizr.execution=oci-v1)"
