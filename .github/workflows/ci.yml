  security-qualification:
    needs: [scope]
    if: ${{ !cancelled() && github.ref != 'refs/heads/master' && needs.scope.result == 'success' && needs.scope.outputs.product == 'true' }}
    uses: ./.github/workflows/security.yml
    with:
      scope_ready: ${{ inputs.qualification_layout != 'independent' }}
      product: ${{ fromJSON(needs.scope.outputs.product) }}
      examples: ${{ fromJSON(needs.scope.outputs.examples) }}

  mkdocs-qualification:
    needs: [scope, distributions]
    if: ${{ !cancelled() && github.ref != 'refs/heads/master' && needs.scope.result == 'success' && (needs.distributions.result == 'success' || (needs.scope.outputs.product == 'false' && needs.distributions.result == 'skipped')) }}
    # Upper bound for the existing master-only deploy job. The called build
    # explicitly has contents: read; this caller never runs on master.
    permissions:
      contents: write
      pages: read
    uses: ./.github/workflows/mkdocs.yaml
    with:
      scope_ready: ${{ inputs.qualification_layout != 'independent' }}
      product: ${{ fromJSON(needs.scope.outputs.product) }}
      examples: ${{ fromJSON(needs.scope.outputs.examples) }}
      candidate_artifact: ${{ inputs.qualification_layout != 'independent' && needs.distributions.result == 'success' && 'release-candidate' || '' }}

  dependencies:
    name: ${{ github.ref == 'refs/heads/master' && 'external-dependencies' || 'dependencies' }}
    needs: [scope, security-qualification]
    if: ${{ !cancelled() && github.ref != 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the shared qualification result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PRODUCT_CHECKS: ${{ needs.scope.outputs.product }}
          QUALIFICATION_RESULT: ${{ needs.security-qualification.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$PRODUCT_CHECKS" in
            true) test "$QUALIFICATION_RESULT" = success ;;
            false) test "$QUALIFICATION_RESULT" = skipped ;;
            *) exit 1 ;;
          esac

  codeql:
    name: ${{ github.ref == 'refs/heads/master' && 'external-codeql' || 'codeql' }}
    needs: [scope, security-qualification]
    if: ${{ !cancelled() && github.ref != 'refs/heads/master' }}
