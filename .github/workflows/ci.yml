name: CI

on:
  push:
    branches: [master, '0.4.6']
  pull_request:
  workflow_dispatch:
    inputs:
      qualification_layout:
        description: Shared inputs normally; independent inputs only for a deliberate cost comparison
        type: choice
        default: shared
        options: [shared, independent]

# Supersede only earlier runs for the same PR. Other events get unique groups,
# so even pending manual, push and scheduled qualifications cannot cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml

  distributions:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.product != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Build the four candidate wheels and sdists exactly once
        run: |
          uv run --locked python -m scripts.qualification.packaging.coordinated_distributions build --candidate "$RUNNER_TEMP/candidate"
          uv run --locked python -m scripts.qualification.packaging.check_distribution "$RUNNER_TEMP/candidate/dist" --coordinated --manifest "$RUNNER_TEMP/candidate/SHA256SUMS.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: ${{ runner.temp }}/candidate/dist/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-checksums
          path: ${{ runner.temp }}/candidate/SHA256SUMS.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  release-target:
    needs: distributions
    timeout-minutes: 35
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.11'}
          - {os: macos-latest, python: '3.14'}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Set isolated candidate paths
        run: |
          echo "APIZR_RELEASE_SET=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"
          echo "APIZR_RELEASE_TARGET=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Prepare disposable SSH prerequisites
        if: runner.os == 'Linux'
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          sudo install -d -m 755 /run/sshd
      - run: uv sync --locked
      - name: Export locked dependency closures and catalog for this exact target
        run: uv run --locked python -m scripts.qualification.packaging.coordinated_distributions target --candidate "$APIZR_RELEASE_SET" --output "$APIZR_RELEASE_TARGET"
      - name: pip, uv, pipx, extras, Git, migration and profile installation
        run: uv run --locked python -m scripts.qualification.packaging.qualify_distributions --candidate "$APIZR_RELEASE_SET" --target "$APIZR_RELEASE_TARGET" --output "$RUNNER_TEMP/qualification"
      - name: Real MCP sessions from the same candidate bytes
        run: |
          uv run --locked python -m scripts.qualification.interfaces.smoke_mcp_server --output "$RUNNER_TEMP/mcp-candidate"
          uv run --locked python -m scripts.qualification.extensions.run_catalog_offline_proof "$RUNNER_TEMP/mcp-candidate"
          "$RUNNER_TEMP/mcp-candidate/client/bin/python" -B scripts/mcp_uninstall_proof.py "$RUNNER_TEMP/mcp-candidate"
      - name: Ordinary scikit-learn notebook, real REST/MCP and retained-wheel replay
        run: uv run --locked python -m scripts.qualification.experiments.qualify_data_science_journey --candidate "$APIZR_RELEASE_SET" --target "$APIZR_RELEASE_TARGET" --output "$RUNNER_TEMP/data-science"
      - name: Archive installable export without installed environments
        if: always()
        run: |
          if test -d "$APIZR_RELEASE_TARGET"; then
            tar -czf "$RUNNER_TEMP/target-export.tar.gz" -C "$APIZR_RELEASE_TARGET" .
          fi
          if test -d "$RUNNER_TEMP/data-science/science-wheels"; then
            tar -czf "$RUNNER_TEMP/science-wheels.tar.gz" -C "$RUNNER_TEMP/data-science" science-wheels
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-target-${{ matrix.os }}-${{ matrix.python }}
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/target-export.tar.gz
            ${{ runner.temp }}/qualification/
            ${{ runner.temp }}/mcp-candidate/*.json
            ${{ runner.temp }}/mcp-candidate/*.log
            ${{ runner.temp }}/science-wheels.tar.gz
            ${{ runner.temp }}/data-science/*.json
            ${{ runner.temp }}/data-science/*.log
            ${{ runner.temp }}/data-science/science-audit-requirements.txt
            ${{ runner.temp }}/data-science/bundles/

  release-delivery:
    needs: distributions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Set isolated candidate paths
        run: |
          echo "APIZR_RELEASE_SET=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"
          echo "APIZR_RELEASE_TARGET=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Same candidates through build, TLS push, signing, timestamp and offline proof
        run: python3 -m scripts.qualification.delivery.smoke_oci_registry --artifacts --output "$RUNNER_TEMP/candidate-delivery"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-delivery
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: ${{ runner.temp }}/candidate-delivery/

  quality:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Preserve required contexts and mixed unscoped checks; bind once for steps.
    env:
      PRODUCT_CHECKS: ${{ needs.scope.outputs.product }}
    steps:
      - name: Require a successful scope decision
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$PRODUCT_CHECKS" = true || test "$PRODUCT_CHECKS" = false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - name: Check DCO declarations for new contributions
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # Keep the published #143 squash and its corrective declaration in
          # the same audit range, including in later PRs and push events.
          DCO_AUDIT_BASE: 83e28cb5d8ffbb4cb820122e125b03695e10fda8
        run: |
          if test "$DCO_BASE" = 0000000000000000000000000000000000000000; then
            # Branch creation has no previous commit; audit its inherited history.
            git merge-base --is-ancestor "$DCO_AUDIT_BASE" "$DCO_HEAD"
            DCO_BASE="$DCO_AUDIT_BASE"
          elif git merge-base --is-ancestor "$DCO_AUDIT_BASE" "$DCO_BASE"; then
            DCO_BASE="$DCO_AUDIT_BASE"
          fi
          uv run --locked python -m scripts.qualification.ci.check_dco --base "$DCO_BASE" --head "$DCO_HEAD"
      - if: env.PRODUCT_CHECKS != 'false'
        run: uv run --locked ruff check .
      - if: env.PRODUCT_CHECKS != 'false'
        run: uv run --locked ruff format --check .
      - if: env.PRODUCT_CHECKS != 'false'
        run: uv run --locked pyright
      - name: Enforce package composition and dependency boundaries
        run: uv run --locked python -m scripts.qualification.ci.check_package_architecture
      - name: Enforce qualification ownership and workflow script references
        run: uv run --locked python -m scripts.qualification.ci.check_script_architecture
      - run: uv run --locked pre-commit run --all-files
      - uses: ./.github/actions/install-attest
        if: env.PRODUCT_CHECKS != 'false'
      - name: Verify managed Attest identity and real offline rejection cases
        if: env.PRODUCT_CHECKS != 'false'
        run: uv run --locked python -m scripts.qualification.packaging.check_attest_identity --attest "$(command -v attest)"

  compatibility:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    # Keep every required matrix check name even when product work is omitted.
    # Preserve required contexts and mixed unscoped checks; bind once for steps.
    env:
      PRODUCT_CHECKS: ${{ needs.scope.outputs.product }}
    steps:
      - name: Web-only change; product tests are not needed
        if: env.PRODUCT_CHECKS == 'false'
        run: echo "Web-only change; validated by quality and Documentation."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PRODUCT_CHECKS != 'false'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: env.PRODUCT_CHECKS != 'false'
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Prepare disposable SSH integration prerequisites
        if: env.PRODUCT_CHECKS != 'false'
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          sudo install -d -m 755 /run/sshd
      - run: uv sync --locked
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked pytest -n auto --maxprocesses=2 --dist=loadfile --max-worker-restart=0 --cov --cov-report=term-missing --cov-report=json:coverage.json --cov-report=xml:coverage.xml --junitxml=tests.xml
        if: env.PRODUCT_CHECKS != 'false'
      - name: Protect the measured legacy coverage separately
        if: env.PRODUCT_CHECKS != 'false'
        run: uv run --locked coverage report --include='src/apizr/modules/*' --fail-under=59.5
      - name: Protect selected evidence line and branch coverage separately
        if: env.PRODUCT_CHECKS != 'false'
        run: uv run --locked python -m scripts.qualification.ci.check_scope_coverage coverage.json
      - run: uv run --locked coverage report --include='src/apizr/capabilities/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/readiness/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/generators/rest/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/generators/mcp/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/interfaces/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/execution/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/tracking/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/extension_runtime/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/git_source/*,src/apizr/cli/commands/git_source.py' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/plugins/local/*,src/apizr/plugins/artifacts/*,src/apizr/cli/commands/plugins.py' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/governed/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/repository/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/graph/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/repository_readiness/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/repository_interfaces/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/repository_execution/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/governed_repository/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/exposure/*' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/cli/commands/exposure.py' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/cli/commands/readiness.py,src/apizr/cli/commands/repository_readiness.py,src/apizr/cli/commands/repository.py' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked coverage report --include='src/apizr/execution/worker.py,src/apizr/execution/supervisor.py,src/apizr/execution/protocol.py' --fail-under=90
        if: env.PRODUCT_CHECKS != 'false'

      - name: Preserve tests and branch coverage
        if: (always()) && env.PRODUCT_CHECKS != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-linux-python-${{ matrix.python }}
          path: |
            tests.xml
            coverage.json
            coverage.xml
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  macos:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.scope.outputs.product == 'false' && 'ubuntu-latest' || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    # Keep every required matrix check name even when product work is omitted.
    # Preserve required contexts and mixed unscoped checks; bind once for steps.
    env:
      PRODUCT_CHECKS: ${{ needs.scope.outputs.product }}
    steps:
      - name: Web-only change; product tests are not needed
        if: env.PRODUCT_CHECKS == 'false'
        run: echo "Web-only change; validated by quality and Documentation."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PRODUCT_CHECKS != 'false'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: env.PRODUCT_CHECKS != 'false'
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
        if: env.PRODUCT_CHECKS != 'false'
      - run: uv run --locked pytest -n auto --maxprocesses=2 --dist=loadfile --max-worker-restart=0 --cov --cov-report=term-missing --cov-report=json:coverage.json --junitxml=tests.xml
        if: env.PRODUCT_CHECKS != 'false'
      - name: Protect selected evidence line and branch coverage separately
        if: env.PRODUCT_CHECKS != 'false'
        run: uv run --locked python -m scripts.qualification.ci.check_scope_coverage coverage.json
      - run: uv run --locked coverage report --include='src/apizr/modules/*' --fail-under=59.5
        if: env.PRODUCT_CHECKS != 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: (always()) && env.PRODUCT_CHECKS != 'false'
        with:
          name: validation-macos-python-${{ matrix.python }}
          path: |
            tests.xml
            coverage.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  security-mutations:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.product != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m scripts.qualification.ci.security_mutations
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-mutation-evidence
          path: mutation-evidence/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  package:
    needs: distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      - name: Prepare disposable SSH integration prerequisites
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          sudo install -d -m 755 /run/sshd
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - run: uv run --locked python -m scripts.qualification.packaging.check_distribution dist --coordinated --manifest SHA256SUMS.json
      - name: Verify minimal and optional installed-wheel dependency paths
        run: |
          uv run --locked python -m scripts.qualification.packaging.smoke_installations dist/outerspace_apizr-*.whl
          uv run --locked python -m scripts.qualification.packaging.smoke_installations dist/outerspace_apizr-*.whl --python 3.11
      - run: uv run --locked python -m scripts.qualification.packaging.smoke_wheel dist/outerspace_apizr-*.whl --scientific-proof release-evidence/scientific-contracts-proof.json
      - name: Real Jupyter SDK sessions from the installed candidate outside checkout
        run: uv run --locked python -m scripts.qualification.experiments.experiment_jupyter_proof dist/outerspace_apizr-*.whl --output release-evidence/jupyter-proof.json
      - name: Check the same wheel on the oldest supported Python
        run: uv run --locked python -m scripts.qualification.packaging.smoke_wheel dist/outerspace_apizr-*.whl --python 3.11
      - name: Preserve source, lock and dependency SBOMs
        run: uv run --locked python -m scripts.qualification.packaging.build_evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-evidence
          path: release-evidence/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  container:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    # Keep every required matrix check name even when product work is omitted.
    # Preserve required contexts and mixed unscoped checks; bind once for steps.
    env:
      PRODUCT_CHECKS: ${{ needs.scope.outputs.product }}
    steps:
      - name: Web-only change; product tests are not needed
        if: env.PRODUCT_CHECKS == 'false'
        run: echo "Web-only change; validated by quality and Documentation."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PRODUCT_CHECKS != 'false'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: env.PRODUCT_CHECKS != 'false'
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
        if: env.PRODUCT_CHECKS != 'false'
      # Generate once per target: verifies target-specific dependency resolution in Docker.
      - run: uv run --locked python -m scripts.qualification.packaging.smoke_container --python-version "${{ matrix.python }}"
        if: env.PRODUCT_CHECKS != 'false'

  oci-isolation:
    needs: distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      # systemd scope GC can discard OOM evidence before containerd reads it:
      # https://github.com/containerd/containerd/pull/12819
      # Keep every assertion; use the cgroupfs driver on this disposable runner.
      - name: Configure reliable Docker OOM evidence on the test runner
        run: |
          docker info --format 'Docker={{.ServerVersion}} cgroup_driver={{.CgroupDriver}} cgroup_version={{.CgroupVersion}}'
          sudo python3 - <<'PYCONFIG'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          options = config.get("exec-opts", [])
          config["exec-opts"] = [option for option in options if not option.startswith("native.cgroupdriver=")]
          config["exec-opts"].append("native.cgroupdriver=cgroupfs")
          path.write_text(json.dumps(config) + "\n")
          PYCONFIG
          sudo systemctl restart docker
          docker info --format 'Docker={{.ServerVersion}} cgroup_driver={{.CgroupDriver}} cgroup_version={{.CgroupVersion}}'
          test "$(docker info --format '{{.CgroupDriver}}')" = cgroupfs
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Deliberately build local fixture worker image
        run: uv run --locked python -m scripts.qualification.packaging.build_worker_image dist/outerspace_apizr-*.whl --output /tmp/apizr-worker-image.json
      - name: Exercise actual Linux container boundaries
        env:
          APIZR_TEST_OCI_IMAGE: /tmp/apizr-worker-image.json
        run: uv run --locked pytest tests/subprocess_guard tests/oci tests/governed_oci tests/repository_execution tests/governed_repository --cov=apizr.subprocess_guard --cov=apizr.oci --cov=apizr.governed_oci --cov=apizr.repository_execution --cov=apizr.governed_repository --cov-report=term-missing --cov-fail-under=90 --junitxml=oci-tests.xml -k "not repeated"
      - name: Every repeated OOM, ordinary failure and timeout sample must pass
        env:
          APIZR_TEST_OCI_IMAGE: /tmp/apizr-worker-image.json
        run: uv run --locked pytest tests/subprocess_guard tests/oci tests/governed_oci tests/repository_execution tests/governed_repository -k repeated --cov=apizr.subprocess_guard --cov=apizr.oci --cov=apizr.governed_oci --cov=apizr.repository_execution --cov=apizr.governed_repository --cov-append --cov-report=term-missing --cov-report=json:oci-coverage.json --cov-fail-under=90 --junitxml=oci-repeated.xml
      - run: uv run --locked coverage report --include='src/apizr/subprocess_guard/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/oci/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/oci/docker.py,src/apizr/oci/provider.py,src/apizr/oci/supervisor.py' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/governed_oci/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/repository_execution/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/governed_repository/*' --fail-under=90
      - name: Installed wheel supports explicit OCI execution
        run: uv run --locked python -m scripts.qualification.packaging.smoke_wheel dist/outerspace_apizr-*.whl --runtime-image-config /tmp/apizr-worker-image.json
      - name: Assert no invocation containers remain
        if: always()
        run: test -z "$(docker ps -aq --filter label=org.apizr.execution=oci-v1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-oci
          path: |
            oci-tests.xml
            oci-repeated.xml
            oci-coverage.json
            /tmp/apizr-worker-image.json
            /tmp/apizr-worker-image.inventory.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  provenance:
    # New evidence is limited to the active protected development branch.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' && github.ref_protected
    needs: [quality, compatibility, macos, package, container, oci-isolation, security-mutations, release-target, release-delivery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Isolated signer: no checkout or repository code execution.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-evidence
          path: evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: validation-*
          path: evidence/validation
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-mutation-evidence
          path: evidence/security-mutations
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: evidence/coordinated
      - name: Archive validation evidence with the exact build inputs
        run: |
          mkdir attestations
          tar -czf attestations/ci-evidence.tar.gz -C evidence .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/*
            attestations/ci-evidence.tar.gz
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        id: sbom
        with:
          subject-path: dist/outerspace_apizr-*
          sbom-path: evidence/sbom-runtime.cdx.json
      - name: Name the verifiable bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" attestations/build-provenance.sigstore.json
          cp "$SBOM_BUNDLE" attestations/runtime-sbom.sigstore.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-attestations
          path: attestations/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  release-assets:
    needs: [provenance, release-target, release-delivery]
    if: >-
      !cancelled() && needs.release-target.result == 'success' &&
      needs.release-delivery.result == 'success' &&
      (needs.provenance.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: downloads
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name != 'pull_request'
        with:
          name: build-attestations
          path: downloads/build-attestations
      - name: Prepare attachments; never upload to a release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          options=(--preview)
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ] && { [ "$version" = 0.4.4 ] || [ "$version" = 0.4.5 ]; }; then
            options=()
          fi
          python3 scripts/prepare_release_assets.py --downloads downloads --output release-assets --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --source-ref "$GITHUB_REF" "${options[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  attest-delivery-plugin-qualification:
    needs: [scope]
    if: ${{ !cancelled() && github.ref != 'refs/heads/master' && needs.scope.result == 'success' && needs.scope.outputs.product == 'true' }}
    uses: ./.github/workflows/attest-delivery-plugin.yml
    with:
      scope_ready: ${{ inputs.qualification_layout != 'independent' }}
      product: ${{ fromJSON(needs.scope.outputs.product) }}
      examples: ${{ fromJSON(needs.scope.outputs.examples) }}

