name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - name: Check DCO declarations for new contributions
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --locked python scripts/check_dco.py --base "$DCO_BASE" --head "$DCO_HEAD"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - run: uv run --locked pre-commit run --all-files
      - uses: ./.github/actions/install-attest
      - name: Verify managed Attest identity and real offline rejection cases
        run: uv run --locked python scripts/check_attest_identity.py --attest "$(command -v attest)"

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest --cov --cov-report=term-missing --cov-report=json:coverage.json --cov-report=xml:coverage.xml --junitxml=tests.xml
      - name: Protect the measured legacy coverage separately
        run: uv run --locked coverage report --include='src/apizr/modules/*' --fail-under=59.5
      - run: uv run --locked coverage report --include='src/apizr/capabilities/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/readiness/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/generators/rest/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/generators/mcp/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/interfaces/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/execution/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/governed/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/repository/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/graph/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/repository_readiness/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/exposure/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/exposure_cli.py' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/readiness_cli.py,src/apizr/repository_readiness_cli.py,src/apizr/repository_cli.py' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/execution/worker.py,src/apizr/execution/supervisor.py,src/apizr/execution/protocol.py' --fail-under=90

      - name: Preserve tests and branch coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-linux-python-${{ matrix.python }}
          path: |
            tests.xml
            coverage.json
            coverage.xml
          if-no-files-found: error
          retention-days: 90

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest --cov --cov-report=term-missing --cov-report=json:coverage.json --junitxml=tests.xml
      - run: uv run --locked coverage report --include='src/apizr/modules/*' --fail-under=59.5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-macos-python-${{ matrix.python }}
          path: |
            tests.xml
            coverage.json
          if-no-files-found: error
          retention-days: 90

  security-mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/security_mutations.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-mutation-evidence
          path: mutation-evidence/
          if-no-files-found: error
          retention-days: 90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv build
      - run: uv run --locked python scripts/check_distribution.py dist --manifest SHA256SUMS.json
      - run: uv run --locked python scripts/smoke_wheel.py dist/*.whl
      - name: Check the same wheel on the oldest supported Python
        run: uv run --locked python scripts/smoke_wheel.py dist/*.whl --python 3.11
      - name: Preserve source, lock and dependency SBOMs
        run: uv run --locked python scripts/build_evidence.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-checksums
          path: SHA256SUMS.json
          if-no-files-found: error
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      # Generate once per target: verifies target-specific dependency resolution in Docker.
      - run: uv run --locked python scripts/smoke_container.py --python-version "${{ matrix.python }}"

  oci-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
          enable-cache: true
      # systemd scope GC can discard OOM evidence before containerd reads it:
      # https://github.com/containerd/containerd/pull/12819
      # Keep every assertion; use the cgroupfs driver on this disposable runner.
      - name: Configure reliable Docker OOM evidence on the test runner
        run: |
          docker info --format 'Docker={{.ServerVersion}} cgroup_driver={{.CgroupDriver}} cgroup_version={{.CgroupVersion}}'
          sudo python3 - <<'PYCONFIG'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          options = config.get("exec-opts", [])
          config["exec-opts"] = [option for option in options if not option.startswith("native.cgroupdriver=")]
          config["exec-opts"].append("native.cgroupdriver=cgroupfs")
          path.write_text(json.dumps(config) + "\n")
          PYCONFIG
          sudo systemctl restart docker
          docker info --format 'Docker={{.ServerVersion}} cgroup_driver={{.CgroupDriver}} cgroup_version={{.CgroupVersion}}'
          test "$(docker info --format '{{.CgroupDriver}}')" = cgroupfs
      - run: uv sync --locked
      - run: uv build
      - name: Deliberately build local fixture worker image
        run: uv run --locked python scripts/build_worker_image.py dist/*.whl --output /tmp/apizr-worker-image.json
      - name: Exercise actual Linux container boundaries
        env:
          APIZR_TEST_OCI_IMAGE: /tmp/apizr-worker-image.json
        run: uv run --locked pytest tests/oci tests/governed_oci --cov=apizr.oci --cov=apizr.governed_oci --cov-report=term-missing --cov-fail-under=90 --junitxml=oci-tests.xml -k "not repeated"
      - name: Every repeated OOM, ordinary failure and timeout sample must pass
        env:
          APIZR_TEST_OCI_IMAGE: /tmp/apizr-worker-image.json
        run: uv run --locked pytest tests/oci tests/governed_oci -k repeated --cov=apizr.oci --cov=apizr.governed_oci --cov-append --cov-report=term-missing --cov-report=json:oci-coverage.json --cov-fail-under=90 --junitxml=oci-repeated.xml
      - run: uv run --locked coverage report --include='src/apizr/oci/*' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/oci/docker.py,src/apizr/oci/provider.py,src/apizr/oci/supervisor.py' --fail-under=90
      - run: uv run --locked coverage report --include='src/apizr/governed_oci/*' --fail-under=90
      - name: Installed wheel supports explicit OCI execution
        run: uv run --locked python scripts/smoke_wheel.py dist/*.whl --runtime-image-config /tmp/apizr-worker-image.json
      - name: Assert no invocation containers remain
        if: always()
        run: test -z "$(docker ps -aq --filter label=org.apizr.execution=oci-v1)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-oci
          path: |
            oci-tests.xml
            oci-repeated.xml
            oci-coverage.json
          if-no-files-found: error
          retention-days: 90

  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [quality, compatibility, macos, package, container, oci-isolation, security-mutations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Isolated signer: no checkout or repository code execution.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-evidence
          path: evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: validation-*
          path: evidence/validation
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-mutation-evidence
          path: evidence/security-mutations
      - name: Archive validation evidence with the exact build inputs
        run: |
          mkdir attestations
          tar -czf attestations/ci-evidence.tar.gz -C evidence .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/*
            attestations/ci-evidence.tar.gz
      - uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        id: sbom
        with:
          subject-path: dist/*
          sbom-path: evidence/sbom-runtime.cdx.json
      - name: Name the verifiable bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" attestations/build-provenance.sigstore.json
          cp "$SBOM_BUNDLE" attestations/runtime-sbom.sigstore.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-attestations
          path: attestations/
          if-no-files-found: error
          retention-days: 90
