name: Client collections

on:
  workflow_call:
    inputs:
      scope_ready:
        description: Caller already validated the complete change scope
        type: boolean
        default: false
      product:
        description: Require full product qualification when scope_ready is true
        type: boolean
        default: true
      examples:
        description: Require installed examples when scope_ready is true
        type: boolean
        default: true
  workflow_dispatch:

# Supersede only earlier runs for the same PR. Other events get unique groups,
# so even pending manual, push and scheduled qualifications cannot cancel each other.
concurrency:
  group: Client collections-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    if: ${{ !inputs.scope_ready }}
    uses: ./.github/workflows/change-scope.yml

  native-formats:
    needs: scope
    if: ${{ !cancelled() && (inputs.scope_ready && format('{0}', inputs.product) || needs.scope.outputs.product) != 'false' }}
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
      - run: uv sync --locked
      - name: Collection contracts, safe sync and branch coverage
        run: >-
          uv run --locked pytest tests/client_collections
          --cov=apizr.client_collections --cov=apizr.cli.commands.clients
          --cov-report=term-missing --cov-report=json:clients-coverage.json
          --junitxml=clients-tests.xml
      - name: Exact vendor tools and dependency integrity, without installation scripts
        run: npm ci --prefix scripts/client_collection_tools --ignore-scripts --no-audit --no-fund
      - name: Reviewed vendor dependency compatibility
        run: node scripts/client_collection_tools/check-compatibility.cjs > client-tools-compatibility.json
      - name: Checksum-pinned Inso CLI
        run: uv run --locked python -m scripts.qualification.interfaces.prepare_client_tools "$RUNNER_TEMP/inso"
      - name: Installed wheel, official native validation and real source-free execution
        run: >-
          uv run --locked python -m scripts.qualification.interfaces.client_collections_proof
          --output "$RUNNER_TEMP/client-collections-proof"
          --tools scripts/client_collection_tools
          --postman scripts/client_collection_tools/node_modules/.bin/postman
          --inso "$RUNNER_TEMP/inso/inso"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: client-collections-${{ matrix.os }}-${{ matrix.python }}
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: |
            clients-tests.xml
            clients-coverage.json
            client-tools-compatibility.json
            ${{ runner.temp }}/client-collections-proof/*.json
            ${{ runner.temp }}/client-collections-proof/*.log
            ${{ runner.temp }}/client-collections-proof/postman/
            ${{ runner.temp }}/client-collections-proof/bruno/
            ${{ runner.temp }}/client-collections-proof/insomnia/
