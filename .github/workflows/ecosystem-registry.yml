name: Ecosystem registry audit

on:
  schedule:
    - cron: '23 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-registry-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline controller tests
        run: python3 -m unittest discover -s tests/ecosystem -v
      - name: Replay retained observations without network access
        run: >-
          python3 ecosystem/verify.py
          --replay ecosystem/evidence/2026-10-20.json
          --as-of 2026-10-20T12:09:00+00:00
          --output '${{ runner.temp }}/ecosystem-replay'
      - name: Check documented public APIs (informational)
        run: >-
          python3 ecosystem/verify.py --live
          --output '${{ runner.temp }}/ecosystem-live'
      - name: Retain reports and dated observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecosystem-registry-audit
          path: |
            ${{ runner.temp }}/ecosystem-replay/
            ${{ runner.temp }}/ecosystem-live/
          if-no-files-found: error
          retention-days: 90
      - name: Summarise live observations
        run: cat '${{ runner.temp }}/ecosystem-live/report.md' >> "$GITHUB_STEP_SUMMARY"
