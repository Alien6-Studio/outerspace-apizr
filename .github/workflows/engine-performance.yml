name: Engine performance baseline

# Deliberate measurement only; no duplicate work on each development push.
on:
  workflow_dispatch:

concurrency:
  group: engine-performance-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - name: Record engine timings and history profiles without weakening store limits
        run: uv run --locked python -m scripts.qualification.experiments.benchmark_engine --output "$RUNNER_TEMP/engine-performance"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engine-performance-${{ matrix.os }}-3.14
          path: |
            ${{ runner.temp }}/engine-performance/summary.json
            ${{ runner.temp }}/engine-performance/*.prof
            ${{ runner.temp }}/engine-performance/*.txt
          if-no-files-found: error
          retention-days: 90
