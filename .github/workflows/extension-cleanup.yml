name: Extension cleanup regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Run all 25 repetitions without retrying failures
        run: uv run --locked python scripts/repeat_extension_cleanup.py --repetitions 25 --output "$RUNNER_TEMP/extension-cleanup"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cleanup-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/extension-cleanup
          if-no-files-found: error
          retention-days: 90
