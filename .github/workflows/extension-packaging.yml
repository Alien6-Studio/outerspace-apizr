name: Extension packaging prototype

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uv-tool:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.11'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_extension_probe.py tests/extension_runtime tests/local_plugins tests/test_pipeline_plugins.py tests/test_optional.py --timeout=30
      - run: uv run --locked python scripts/smoke_extension_packaging.py --work-dir "$RUNNER_TEMP/apizr-extension-proof"
      - name: Sync installed plugins with OS network isolation
        run: uv run --locked python scripts/run_plugin_sync_proof.py "$RUNNER_TEMP/apizr-extension-proof"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: extension-uv-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/apizr-extension-proof/evidence.json
            ${{ runner.temp }}/apizr-extension-proof/sync/*evidence*
            ${{ runner.temp }}/apizr-extension-proof/sync/sync-summary.json
          if-no-files-found: error
          retention-days: 90

  homebrew:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_DEVELOPER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Prepare local-only test formula
        # The temporary tap is never pushed; do not impersonate the commit author.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --locked python scripts/prepare_extension_homebrew.py "$RUNNER_TEMP/apizr-brew"
      - run: brew tap apizr-v04/prototype "file://$RUNNER_TEMP/apizr-brew/tap"
      - run: brew install --build-from-source apizr-v04/prototype/apizr-v04-probe
      - run: brew test apizr-v04/prototype/apizr-v04-probe
      - name: Probe real Homebrew installation
        run: |
          uv run --locked python scripts/smoke_extension_packaging.py \
            --work-dir "$RUNNER_TEMP/apizr-extension-proof" \
            --core-python "$(brew --prefix apizr-v04-probe)/libexec/bin/python" \
            --core-root "$(brew --prefix apizr-v04-probe)"
          brew info --json=v2 apizr-v04/prototype/apizr-v04-probe > "$RUNNER_TEMP/apizr-extension-proof/homebrew-receipt.json"
      - name: Sync installed plugins with OS network isolation
        run: uv run --locked python scripts/run_plugin_sync_proof.py "$RUNNER_TEMP/apizr-extension-proof"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: extension-homebrew
          path: |
            ${{ runner.temp }}/apizr-extension-proof/evidence.json
            ${{ runner.temp }}/apizr-extension-proof/sync/*evidence*
            ${{ runner.temp }}/apizr-extension-proof/sync/sync-summary.json
            ${{ runner.temp }}/apizr-extension-proof/homebrew-receipt.json
            ${{ runner.temp }}/apizr-brew/dependency-evidence.json
          if-no-files-found: error
          retention-days: 90
