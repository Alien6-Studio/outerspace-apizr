name: Forge integrations

on:
  workflow_call:
    inputs:
      scope_ready:
        description: Caller already validated the complete change scope
        type: boolean
        default: false
      product:
        description: Require full product qualification when scope_ready is true
        type: boolean
        default: true
      examples:
        description: Require installed examples when scope_ready is true
        type: boolean
        default: true
      candidate_artifact:
        description: Immutable candidate artifact from this same workflow run
        type: string
        default: ''
  workflow_dispatch:

# Supersede only earlier runs for the same PR. Other events get unique groups,
# so even pending manual, push and scheduled qualifications cannot cancel each other.
concurrency:
  group: Forge integrations-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    if: ${{ !inputs.scope_ready }}
    uses: ./.github/workflows/change-scope.yml

  candidate:
    needs: scope
    if: ${{ !cancelled() && (inputs.scope_ready && format('{0}', inputs.product) || needs.scope.outputs.product) != 'false' && inputs.candidate_artifact == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.scope_ready && github.sha || github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Build original coordinated candidates once for this exact source head
        run: |
          uv run --locked python -m scripts.qualification.packaging.coordinated_distributions build --candidate "$RUNNER_TEMP/forge-candidate"
          uv run --locked python -m scripts.qualification.packaging.check_distribution "$RUNNER_TEMP/forge-candidate/dist" --coordinated --manifest "$RUNNER_TEMP/forge-candidate/SHA256SUMS.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-candidate
          path: ${{ runner.temp }}/forge-candidate
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error

  contracts:
    needs: scope
    if: ${{ !cancelled() && (inputs.scope_ready && format('{0}', inputs.product) || needs.scope.outputs.product) != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.scope_ready && github.sha || github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Shared contract, platform metadata, pinned GitLab schema and actual shell argument parity
        env:
          APIZR_FORGE_PARITY_EVIDENCE: forge-parity.json
        run: >-
          uv run --locked pytest tests/ci
          --cov=apizr.ci --cov=apizr.cli.commands.ci --cov-report=term-missing
          --cov-report=json:forge-coverage.json --junitxml=forge-tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: forge-contracts
          path: |
            forge-tests.xml
            forge-coverage.json
            forge-parity.json
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error

  composite:
    needs: [scope, candidate]
    if: ${{ !cancelled() && (inputs.scope_ready && format('{0}', inputs.product) || needs.scope.outputs.product) != 'false' && ((inputs.scope_ready && inputs.candidate_artifact != '') || needs.candidate.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.scope_ready && github.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.candidate_artifact || 'forge-candidate' }}
          path: ${{ runner.temp }}/forge-candidate
      - name: Select original development wheel bytes
        id: wheel
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          candidate = Path(os.environ['RUNNER_TEMP']) / 'forge-candidate'
          assert json.loads((candidate / 'candidate.json').read_text())['commit'] == os.environ['GITHUB_SHA']
          wheel = Path(os.environ['RUNNER_TEMP']) / 'forge-candidate/dist/outerspace_apizr-0.4.6-py3-none-any.whl'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'path={wheel}\nsha256={hashlib.sha256(wheel.read_bytes()).hexdigest()}\n')
          PY
      - name: Explicit authority refusal through the real composite Action
        id: refused
        continue-on-error: true
        uses: ./
        with:
          python-version: ${{ matrix.python }}
          apizr-version: '0.4.6'
          project: tests/fixtures/forge/project/apizr.toml
          wheel-path: ${{ steps.wheel.outputs.path }}
          wheel-sha256: ${{ steps.wheel.outputs.sha256 }}
      - name: Assert refusal did not create evidence or silently authorize
        env:
          OUTCOME: ${{ steps.refused.outcome }}
        run: test "$OUTCOME" = failure && test ! -e .apizr-ci
      - name: Check using the real composite Action
        id: check
        uses: ./
        with:
          operation: check
          python-version: ${{ matrix.python }}
          apizr-version: '0.4.6'
          project: tests/fixtures/forge/project/apizr.toml
          authorize-analysis: 'true'
          output-dir: .apizr-ci-check
          wheel-path: ${{ steps.wheel.outputs.path }}
          wheel-sha256: ${{ steps.wheel.outputs.sha256 }}
      - name: REST bundle using the real composite Action
        uses: ./
        with:
          operation: build-rest
          python-version: ${{ matrix.python }}
          apizr-version: '0.4.6'
          project: tests/fixtures/forge/project/apizr.toml
          authorize-analysis: 'true'
          output-dir: .apizr-ci-build-rest
          wheel-path: ${{ steps.wheel.outputs.path }}
          wheel-sha256: ${{ steps.wheel.outputs.sha256 }}
      - name: MCP bundle using the real composite Action
        uses: ./
        with:
          operation: build-mcp
          python-version: ${{ matrix.python }}
          apizr-version: '0.4.6'
          project: tests/fixtures/forge/project/apizr.toml
          authorize-analysis: 'true'
          output-dir: .apizr-ci-build-mcp
          wheel-path: ${{ steps.wheel.outputs.path }}
          wheel-sha256: ${{ steps.wheel.outputs.sha256 }}
      - name: Installed core outside checkout and canonical API/CLI/Action byte parity
        env:
          WHEEL_PATH: ${{ steps.wheel.outputs.path }}
          WHEEL_SHA256: ${{ steps.wheel.outputs.sha256 }}
          RESULT: ${{ steps.check.outputs.result }}
          STATE: ${{ steps.check.outputs.state }}
        run: |
          test "$RESULT" = .apizr-ci-check/result.json && test "$STATE" = success
          python -I scripts/qualification/ci/forge_integrations_proof.py --wheel "$WHEEL_PATH" --sha256 "$WHEEL_SHA256" --output "$RUNNER_TEMP/forge-proof" --compare-root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-python-${{ matrix.python }}
          include-hidden-files: true
          path: |
            .apizr-ci-check/
            .apizr-ci-build-rest/
            .apizr-ci-build-mcp/
            ${{ runner.temp }}/forge-proof/forge-proof.json
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
