name: Governed REST qualification

on:
  workflow_call:
    inputs:
      scope_ready:
        description: Caller already validated the complete change scope
        type: boolean
        default: false
      product:
        description: Require full product qualification when scope_ready is true
        type: boolean
        default: true
      examples:
        description: Require installed examples when scope_ready is true
        type: boolean
        default: true
  workflow_dispatch:

# Supersede only earlier runs for the same PR. Other events get unique groups,
# so even pending manual, push and scheduled qualifications cannot cancel each other.
concurrency:
  group: Governed REST qualification-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos-rest:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Ten predetermined REST recovery repetitions (no retries)
        shell: bash
        run: |
          mkdir rest-qualification
          for iteration in {1..10}; do
            uv run --locked pytest \
              tests/governed/test_transports.py::test_real_governed_rest_survives_failures_and_tampering \
              --junitxml="rest-qualification/repetition-${iteration}.xml"
          done
      - name: Unchanged short deadlines and HTTP mapping
        run: >-
          uv run --locked pytest tests/execution/test_deadline.py tests/governed/test_mapping.py
          --junitxml=rest-qualification/deadlines-and-mapping.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: governed-rest-macos-python-3.14
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: rest-qualification/*.xml
