name: Homebrew build inputs

on:
  workflow_call:
    inputs:
      scope_ready:
        description: Caller already validated the complete change scope
        type: boolean
        default: false
      product:
        description: Require full product qualification when scope_ready is true
        type: boolean
        default: true
      examples:
        description: Require installed examples when scope_ready is true
        type: boolean
        default: true
      candidate_artifact:
        description: Immutable candidate artifact from this same workflow run
        type: string
        default: ''
  workflow_dispatch:

# Supersede only earlier runs for the same PR. Other events get unique groups,
# so even pending manual, push and scheduled qualifications cannot cancel each other.
concurrency:
  group: Homebrew build inputs-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    if: ${{ !inputs.scope_ready }}
    uses: ./.github/workflows/change-scope.yml

  candidate:
    needs: scope
    if: ${{ !cancelled() && (inputs.scope_ready && format('{0}', inputs.product) || needs.scope.outputs.product) != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.scope_ready && github.sha || github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run --locked python -m scripts.qualification.ci.check_dependency_sources
      - run: uv run --locked python -m scripts.qualification.ci.check_dependency_licenses
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/candidate
      - name: Verify shared candidate bytes and current source identity
        if: inputs.candidate_artifact != ''
        run: uv run --locked python -m scripts.qualification.packaging.coordinated_distributions verify --candidate "$RUNNER_TEMP/candidate"
      - name: Exact coordinated candidate, built once
        if: inputs.candidate_artifact == ''
        run: uv run --locked python -m scripts.qualification.packaging.coordinated_distributions build --candidate "$RUNNER_TEMP/candidate"
      - name: Locked wheelhouse and deterministic manifest
        run: |
          uv run --locked python -m scripts.qualification.packaging.prepare_homebrew_build_inputs --lock uv.lock --policy policy/homebrew-build-inputs.json --output "$RUNNER_TEMP/inputs"
          uv run --locked python -m scripts.qualification.packaging.prepare_homebrew_build_inputs --lock uv.lock --policy policy/homebrew-build-inputs.json --output "$RUNNER_TEMP/inputs-repeat"
          diff -r "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/inputs-repeat"
          uv export --locked --offline --only-group homebrew-build --no-emit-project --format cyclonedx1.5 --output-file "$RUNNER_TEMP/inputs/sbom-homebrew-build.cdx.json"
      - name: Explicit host boundary, preserving the build-input manifest
        run: >-
          uv run --locked python -m scripts.qualification.packaging.check_homebrew_qualification
          --policy policy/homebrew-qualification.json
          --manifest "$RUNNER_TEMP/inputs/build-inputs.json"
          --output "$RUNNER_TEMP/inputs/qualification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.candidate_artifact == ''
        with:
          name: homebrew-build-candidate
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: ${{ runner.temp }}/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-build-wheelhouse
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: ${{ runner.temp }}/inputs

  offline-build-arm64:
    name: Offline Apple Silicon build (CI VM for the Tier-1 target)
    needs: candidate
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    timeout-minutes: 45
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.scope_ready && github.sha || github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.candidate_artifact || 'homebrew-build-candidate' }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-build-wheelhouse
          path: ${{ runner.temp }}/inputs
      - name: Official Homebrew runtime provider
        run: |
          test "$(uname -m)" = arm64
          brew update
          brew install python@3.14 pydantic
      - run: uv sync --locked
      - name: Offline isolated build and independent runtime preflight
        run: >-
          uv run --locked python -m scripts.qualification.packaging.homebrew_build_proof
          --candidate "$RUNNER_TEMP/candidate" --source-sha "$(git rev-parse HEAD)"
          --inputs "$RUNNER_TEMP/inputs" --output "$RUNNER_TEMP/homebrew-build-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: homebrew-build-proof-macos-26
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/homebrew-build-proof/proof.json
            ${{ runner.temp }}/homebrew-build-proof/build-phase.json
            ${{ runner.temp }}/homebrew-build-proof/offline-build.log
