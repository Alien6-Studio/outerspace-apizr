name: Homebrew build inputs

on:
  push:
    branches: [chore/homebrew-build-closure]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml

  candidate:
    needs: scope
    if: always() && needs.scope.outputs.product != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run --locked python scripts/check_dependency_sources.py
      - run: uv run --locked python scripts/check_dependency_licenses.py
      - name: Exact coordinated candidate, built once
        run: uv run --locked python scripts/coordinated_distributions.py build --candidate "$RUNNER_TEMP/candidate"
      - name: Locked wheelhouse and deterministic manifest
        run: |
          uv run --locked python scripts/prepare_homebrew_build_inputs.py --lock uv.lock --policy policy/homebrew-build-inputs.json --output "$RUNNER_TEMP/inputs"
          uv run --locked python scripts/prepare_homebrew_build_inputs.py --lock uv.lock --policy policy/homebrew-build-inputs.json --output "$RUNNER_TEMP/inputs-repeat"
          diff -r "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/inputs-repeat"
          uv export --locked --offline --only-group homebrew-build --no-emit-project --format cyclonedx1.5 --output-file "$RUNNER_TEMP/inputs/sbom-homebrew-build.cdx.json"
      - name: Explicit host boundary, preserving the build-input manifest
        run: >-
          uv run --locked python scripts/check_homebrew_qualification.py
          --policy policy/homebrew-qualification.json
          --manifest "$RUNNER_TEMP/inputs/build-inputs.json"
          --output "$RUNNER_TEMP/inputs/qualification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-build-candidate
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-build-wheelhouse
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/inputs

  offline-build-arm64:
    name: Offline Apple Silicon build (CI VM for the Tier-1 target)
    needs: candidate
    timeout-minutes: 45
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-build-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-build-wheelhouse
          path: ${{ runner.temp }}/inputs
      - name: Official Homebrew runtime provider
        run: |
          test "$(uname -m)" = arm64
          brew update
          brew install python@3.14 pydantic
      - run: uv sync --locked
      - name: Offline isolated build and independent runtime preflight
        run: >-
          uv run --locked python scripts/homebrew_build_proof.py
          --candidate "$RUNNER_TEMP/candidate" --source-sha "$(git rev-parse HEAD)"
          --inputs "$RUNNER_TEMP/inputs" --output "$RUNNER_TEMP/homebrew-build-proof"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: homebrew-build-proof-macos-26
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/homebrew-build-proof/proof.json
            ${{ runner.temp }}/homebrew-build-proof/build-phase.json
            ${{ runner.temp }}/homebrew-build-proof/offline-build.log
