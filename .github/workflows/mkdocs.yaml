name: Documentation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml

  build:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful scope decision
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          EXAMPLE_CHECKS: ${{ needs.scope.outputs.examples }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$EXAMPLE_CHECKS" = true || test "$EXAMPLE_CHECKS" = false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.0'
          python-version: '3.11'
      - run: uv sync --locked --group docs
      - name: Test change routing and documentation publication tooling
        if: needs.scope.outputs.product != 'false'
        run: uv run --locked pytest tests/test_ci_scope.py tests/test_docs_publication.py
      - run: uv run --locked --group docs mkdocs build --strict
      - run: uv run --locked python scripts/check_docs_html.py
      - name: Check current and historical examples with installed wheels outside the checkout
        if: needs.scope.outputs.examples != 'false'
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/docs-wheel"
          uv venv --python 3.11 "$RUNNER_TEMP/docs-stable"
          uv pip install --python "$RUNNER_TEMP/docs-stable/bin/python" outerspace-apizr==0.3.0
          uv run --locked python scripts/smoke_readme.py "$RUNNER_TEMP/docs-stable/bin/apizr"
          uv venv --python 3.11 "$RUNNER_TEMP/docs-public"
          uv pip install --python "$RUNNER_TEMP/docs-public/bin/python" outerspace-apizr==0.4.4
          uv run --locked python scripts/smoke_readme.py "$RUNNER_TEMP/docs-public/bin/apizr" --development --expected-version 0.4.4
          uv venv --python 3.11 "$RUNNER_TEMP/docs-dev"
          uv pip install --python "$RUNNER_TEMP/docs-dev/bin/python" "$RUNNER_TEMP"/docs-wheel/*.whl
          uv run --locked python scripts/smoke_readme.py "$RUNNER_TEMP/docs-dev/bin/apizr" --development
      - name: Validate the source identity before retaining the built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: uv run --locked python scripts/check_docs_site.py --check-local --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: documentation-site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    # Serialize deployment AND observation. Never cancel after gh-pages is pushed.
    concurrency:
      group: documentation-publication
      cancel-in-progress: false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.0'
          python-version: '3.11'
      - run: uv sync --locked --group docs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-site
          path: site
      - name: Validate the retained site against this exact source
        run: |
          uv run --locked python scripts/check_docs_site.py --check-local --source-commit "$GITHUB_SHA"
          uv run --locked python scripts/check_docs_html.py
      - name: Ignore superseded queued deployments explicitly
        id: current
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if test "$actual" = "$EXPECTED_COMMIT"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Superseded by $actual; no deployment or public confirmation for $EXPECTED_COMMIT." >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the validated site to gh-pages without rebuilding
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        run: |
          uv run --locked --group docs python -m ghp_import --no-jekyll --push --force \
            --message "Deploy documentation from $GITHUB_SHA" site
          generated=$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" --jq .sha)
          echo "commit=$generated" >> "$GITHUB_OUTPUT"
      - name: Verify GitHub Pages publication and exact public HTTPS content
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOYMENT_COMMIT: ${{ steps.deployment.outputs.commit }}
        run: |
          uv run --locked python scripts/check_docs_site.py --site site \
            --source-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --deployment-commit "$DEPLOYMENT_COMMIT" \
            --timeout 600
          echo "Confirmed source $GITHUB_SHA via Pages commit $DEPLOYMENT_COMMIT and https://apizr.outerspace.sh/." >> "$GITHUB_STEP_SUMMARY"
