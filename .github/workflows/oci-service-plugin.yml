name: OCI service plugin

on:
  workflow_call:
    inputs:
      scope_ready:
        description: Caller already validated the complete change scope
        type: boolean
        default: false
      product:
        description: Require full product qualification when scope_ready is true
        type: boolean
        default: true
      examples:
        description: Require installed examples when scope_ready is true
        type: boolean
        default: true
  workflow_dispatch:

# Supersede only earlier runs for the same PR. Other events get unique groups,
# so even pending manual, push and scheduled qualifications cannot cancel each other.
concurrency:
  group: OCI service plugin-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    if: ${{ !inputs.scope_ready }}
    uses: ./.github/workflows/change-scope.yml

  service-images:
    needs: scope
    if: ${{ !cancelled() && (inputs.scope_ready && format('{0}', inputs.product) || needs.scope.outputs.product) != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Check optional plugin coverage separately
        run: uv run --locked pytest tests/oci_plugin --cov=apizr_oci --cov-report=term-missing --cov-report=json:plugin-coverage.json --junitxml=plugin-tests.xml
      - name: Build and call real REST/MCP images from installed wheels
        env:
          PROOF_DIR: ${{ runner.temp }}/oci-service-proof
        run: uv run --locked python -m scripts.qualification.delivery.smoke_oci_plugin --work-dir "$PROOF_DIR" --docker-socket /var/run/docker.sock > oci-service-proof.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oci-service-proof
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: |
            plugin-coverage.json
            plugin-tests.xml
            oci-service-proof.log
            ${{ runner.temp }}/oci-service-proof/operator-git-refusals.json
            ${{ runner.temp }}/oci-service-proof/operator-build*.json
            ${{ runner.temp }}/oci-service-proof/results.json
            ${{ runner.temp }}/oci-service-proof/application-portability.json
            ${{ runner.temp }}/oci-service-proof/interruption.json
            ${{ runner.temp }}/oci-service-proof/refusals.json
            ${{ runner.temp }}/oci-service-proof/*-build.json
            ${{ runner.temp }}/oci-service-proof/*.lock
            ${{ runner.temp }}/oci-service-proof/governance-*/
            ${{ runner.temp }}/oci-service-proof/*-build-result.json
            ${{ runner.temp }}/oci-service-proof/catalog-oci/

  registry-publication:
    needs: scope
    if: ${{ !cancelled() && (inputs.scope_ready && format('{0}', inputs.product) || needs.scope.outputs.product) != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish to a disposable authenticated HTTPS registry and pull by digest
        run: python3 -m scripts.qualification.delivery.smoke_oci_registry --output "$RUNNER_TEMP/oci-registry-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oci-registry-proof
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: ${{ runner.temp }}/oci-registry-proof
