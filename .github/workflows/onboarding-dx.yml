name: Local developer experience

on:
  workflow_call:
    inputs:
      scope_ready:
        description: Caller already validated the complete change scope
        type: boolean
        default: false
      product:
        description: Require full product qualification when scope_ready is true
        type: boolean
        default: true
      examples:
        description: Require installed examples when scope_ready is true
        type: boolean
        default: true
  workflow_dispatch:

# Supersede only earlier runs for the same PR. Other events get unique groups,
# so even pending manual, push and scheduled qualifications cannot cancel each other.
concurrency:
  group: Local developer experience-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    if: ${{ !inputs.scope_ready }}
    uses: ./.github/workflows/change-scope.yml

  local-dx:
    needs: scope
    if: ${{ !cancelled() && (inputs.scope_ready && format('{0}', inputs.product) || needs.scope.outputs.product) != 'false' }}
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
      - name: Real bash, zsh and fish prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bash zsh fish
      - run: uv sync --locked
      - name: Publication safety, read-only diagnostics and CLI grammar parity
        env:
          APIZR_REQUIRE_SHELLS: ${{ runner.os == 'Linux' && '1' || '' }}
        run: >-
          uv run --locked pytest tests/onboarding
          --cov=apizr.onboarding --cov=apizr.cli.commands.onboarding --cov=apizr.cli.completion
          --cov-report=term-missing --cov-report=json:onboarding-coverage.json
          --junitxml=onboarding-tests.xml
      - name: Installed wheel, real onboarding and shell adapters
        run: >-
          uv run --locked python -m scripts.qualification.interfaces.onboarding_proof
          --output "$RUNNER_TEMP/onboarding-proof"
          ${{ runner.os == 'Linux' && '--require-shells' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: onboarding-${{ matrix.os }}-${{ matrix.python }}
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          if-no-files-found: error
          path: |
            onboarding-tests.xml
            onboarding-coverage.json
            ${{ runner.temp }}/onboarding-proof/onboarding-proof.json
            ${{ runner.temp }}/onboarding-proof/apizr.*
