name: Plugin preparation qualification

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 2'

permissions:
  contents: read

jobs:
  uv-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect an unqualified stable uv series and inconsistent development pins
        run: python3 scripts/check_uv_policy.py --output uv-policy.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-policy
          path: uv-policy.json
          if-no-files-found: error
          retention-days: 14

  native:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, python: '3.14', uv: '0.13.0', intel: false}
          - {os: macos-latest, python: '3.14', uv: '0.13.1', intel: false}
          - {os: macos-15-intel, python: '3.14', uv: '0.13.0', intel: true}
          - {os: macos-15-intel, python: '3.14', uv: '0.13.1', intel: true}
          - {os: ubuntu-latest, python: '3.11', uv: '0.13.1', intel: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ matrix.uv }}
          python-version: ${{ matrix.python }}
      - name: Installed native core resolution and MCP, OCI, Attest preparation
        env:
          WITHOUT_MCP: ${{ matrix.intel && '--without-mcp' || '' }}
        run: uv run --no-project --python "${{ matrix.python }}" python scripts/plugin_preparation_matrix_proof.py --output "$RUNNER_TEMP/preparation-native" $WITHOUT_MCP
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: preparation-${{ matrix.os }}-python-${{ matrix.python }}-uv-${{ matrix.uv }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/preparation-native/*.json
            ${{ runner.temp }}/preparation-native/*.lock
            ${{ runner.temp }}/preparation-native/wheels/
            ${{ runner.temp }}/preparation-native/prepared-*/preparation.json
            ${{ runner.temp }}/preparation-native/prepared-*/requirements.lock
            ${{ runner.temp }}/preparation-native/intel-mcp-refusal/*.json
            ${{ runner.temp }}/preparation-native/intel-mcp-refusal/*.lock

  linux-libc:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
        uv: ['0.12.0', '0.13.0', '0.13.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Real glibc baseline, core and all plugin closures
        env:
          DEBIAN: ${{ matrix.debian }}
          UV_VERSION: ${{ matrix.uv }}
        run: |
          mkdir -p "$RUNNER_TEMP/preparation-linux"
          libc=2.36
          if [ "$DEBIAN" = trixie ]; then libc=2.41; fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/checkout:ro" -v "$RUNNER_TEMP/preparation-linux:/proof" \
            -w /checkout -e QUALIFICATION_UV="$UV_VERSION" -e QUALIFICATION_LIBC="$libc" \
            "python:3.14-slim-$DEBIAN" sh -ec '
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends git ca-certificates >/dev/null
              python -m pip install "uv==$QUALIFICATION_UV" >/dev/null
              python scripts/plugin_preparation_matrix_proof.py --output /proof/results --expect-glibc "$QUALIFICATION_LIBC"
            '
          docker image inspect "python:3.14-slim-$DEBIAN" > "$RUNNER_TEMP/preparation-linux/image.json"
      - name: Return disposable container evidence to the artifact uploader
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/preparation-linux" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/preparation-linux"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: preparation-debian-${{ matrix.debian }}-uv-${{ matrix.uv }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/preparation-linux/image.json
            ${{ runner.temp }}/preparation-linux/results/*.json
            ${{ runner.temp }}/preparation-linux/results/*.lock
            ${{ runner.temp }}/preparation-linux/results/wheels/
            ${{ runner.temp }}/preparation-linux/results/prepared-*/preparation.json
            ${{ runner.temp }}/preparation-linux/results/prepared-*/requirements.lock
