name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Already published immutable GitHub release tag
        required: true
      source_sha:
        description: Reviewed full release source SHA
        required: true

permissions:
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SOURCE: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Admit protected release source before checkout
        run: |
          python3 - <<'PYADMIT'
          import json, os, re, subprocess
          repo = 'Alien6-Studio/outerspace-apizr'
          source, tag = os.environ['RELEASE_SOURCE'], os.environ['RELEASE_TAG']
          if not re.fullmatch(r'[0-9a-f]{40}', source) or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise ValueError('Require a full source SHA and final version tag')
          def gh(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}'], text=True, timeout=30))
          release, branch = gh(f'releases/tags/{tag}'), gh('branches/master')
          tagged, comparison = gh(f'commits/{tag}'), gh(f'compare/{source}...master')
          if release.get('tag_name') != tag or release.get('draft') is not False or release.get('prerelease') is not False or not release.get('published_at'):
              raise ValueError('Require an already published final GitHub Release')
          if tagged.get('sha') != source or branch.get('protected') is not True:
              raise ValueError('Require the exact tag and protected master')
          if comparison.get('status') not in {'ahead', 'identical'} or comparison.get('merge_base_commit', {}).get('sha') != source:
              raise ValueError('Refuse source outside protected master history')
          PYADMIT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.0'
          python-version: '3.11'
      - name: Verify published release identity
        run: |
          uv run --locked python scripts/verify_mcp_publication.py \
            --release-tag "$RELEASE_TAG" --source-sha "$RELEASE_SOURCE" \
            --report "$RUNNER_TEMP/mcp-publication-preflight.json"
      - name: Install verified official publisher
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Validate descriptor
        run: '"$RUNNER_TEMP/mcp-publisher" validate'
      - name: Authenticate with repository identity and publish
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
