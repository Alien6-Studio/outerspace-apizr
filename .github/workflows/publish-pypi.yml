name: Publish PyPI

# Dispatch a protected version/publication tag with an existing artifact tag.
# Publisher fixes never rebuild the reviewed archives or move their source tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag whose exact CI archives will be published
        required: true
        type: string
      ci_run_id:
        description: Successful master CI run containing the exact reviewed distributions
        required: true
        type: string
      package:
        description: Publish all packages or bootstrap one new PyPI project
        required: true
        default: all
        type: choice
        options:
          - all
          - outerspace-apizr
          - outerspace-apizr-oci
          - outerspace-apizr-mcp
          - outerspace-apizr-attest

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify:
    outputs:
      release_sha: ${{ steps.gates.outputs.release_sha }}
      release_version: ${{ steps.gates.outputs.release_version }}
      outerspace_apizr: ${{ steps.public.outputs.outerspace_apizr }}
      outerspace_apizr_oci: ${{ steps.public.outputs.outerspace_apizr_oci }}
      outerspace_apizr_mcp: ${{ steps.public.outputs.outerspace_apizr_mcp }}
      outerspace_apizr_attest: ${{ steps.public.outputs.outerspace_apizr_attest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          path: release-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
      - name: Verify tag, source run, required gates and PyPI availability
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        working-directory: release-source
        run: python ../scripts/verify_release.py --release-tag "$RELEASE_TAG" --coordinated --source-only --run-id "$CI_RUN_ID" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-checksums
          path: checksums
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-attestations
          path: release-evidence
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-audit
          path: release-evidence
          run-id: ${{ steps.gates.outputs.security_run_id }}
          github-token: ${{ github.token }}
      - name: Verify build provenance for all distributions and validation archive
        env:
          RELEASE_SHA: ${{ steps.gates.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/* release-evidence/ci-evidence.tar.gz; do
            gh attestation verify "$artifact" \
              --bundle release-evidence/build-provenance.sigstore.json \
              --repo Alien6-Studio/outerspace-apizr \
              --signer-workflow Alien6-Studio/outerspace-apizr/.github/workflows/ci.yml \
              --source-digest "$RELEASE_SHA" --source-ref refs/heads/master
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-evidence
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
      - run: uv sync --locked
      - name: Inspect metadata and compare build checksums
        run: |
          uv run --locked python scripts/check_distribution.py dist --coordinated --manifest verified.json
          cmp verified.json checksums/SHA256SUMS.json
      - name: Compare any existing public bytes and stage only missing archives
        id: public
        run: |
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("release-source/pyproject.toml","rb"))["project"]["version"])')
          python3 scripts/prepare_publication.py --dist dist --version "$version" --output pending --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-distributions
          path: pending/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  receipt:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          path: release-source
          persist-credentials: false
      - uses: ./.github/actions/install-attest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-evidence
          path: release-evidence
      - name: Sign, timestamp and verify the exact delivery
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          APIZR_ATTEST_SIGNING_KEY: ${{ secrets.APIZR_ATTEST_SIGNING_KEY }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          python3 scripts/attest_release.py --attest "$(command -v attest)" \
            --source-root release-source --dist dist --evidence release-evidence \
            --workspace "$RUNNER_TEMP/apizr-attest-workspace" \
            --output attest-evidence --commit "$RELEASE_SHA" --ci-run "$CI_RUN_ID"
      - name: Remove temporary private material even after interruption
        if: always()
        run: rm -f "$RUNNER_TEMP/apizr-attest-workspace/.attest/keys/"*.key
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attest-release-evidence
          path: attest-evidence/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [verify, receipt]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/outerspace-apizr/
    permissions:
      id-token: write
    steps:
      # No checkout, package installation or source execution in this job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pending-distributions
          path: pending
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: needs.verify.outputs.outerspace_apizr == 'true' && (inputs.package == 'all' || inputs.package == 'outerspace-apizr')
        with:
          packages-dir: pending/outerspace-apizr/
          print-hash: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: needs.verify.outputs.outerspace_apizr_oci == 'true' && (inputs.package == 'all' || inputs.package == 'outerspace-apizr-oci')
        with:
          packages-dir: pending/outerspace-apizr-oci/
          print-hash: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: needs.verify.outputs.outerspace_apizr_mcp == 'true' && (inputs.package == 'all' || inputs.package == 'outerspace-apizr-mcp')
        with:
          packages-dir: pending/outerspace-apizr-mcp/
          print-hash: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: needs.verify.outputs.outerspace_apizr_attest == 'true' && (inputs.package == 'all' || inputs.package == 'outerspace-apizr-attest')
        with:
          packages-dir: pending/outerspace-apizr-attest/
          print-hash: true

  verify-public:
    needs: [publish, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-distributions
          path: dist
      - name: Download and compare published archives
        env:
          PACKAGE: ${{ inputs.package }}
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
        run: |
          if [ "$PACKAGE" = all ]; then
            python3 scripts/prepare_publication.py --dist dist --version "$RELEASE_VERSION" --output public-verification --require-complete
          else
            python3 scripts/prepare_publication.py --dist dist --version "$RELEASE_VERSION" --output public-verification --require-package "$PACKAGE"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: public-package-comparison
          path: public-verification/public-comparison.json
          if-no-files-found: error


  archive-evidence:
    if: inputs.package == 'all'
    needs: verify-public
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-evidence
          path: evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attest-release-evidence
          path: evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-package-comparison
          path: evidence
      - name: Preserve evidence beyond Actions retention
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Alien6-Studio/outerspace-apizr
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" evidence/*
