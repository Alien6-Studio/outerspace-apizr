name: Publish PyPI

# Deliberate dispatch on the release tag after master verification completes.
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful master CI run containing the exact reviewed distributions
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.0'
          python-version: '3.14'
      - name: Verify tag, source run, required gates and PyPI availability
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python scripts/verify_release.py --run-id "$CI_RUN_ID" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-checksums
          path: checksums
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-attestations
          path: release-evidence
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-audit
          path: release-evidence
          run-id: ${{ steps.gates.outputs.security_run_id }}
          github-token: ${{ github.token }}
      - name: Verify build provenance for both distributions and validation archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/* release-evidence/ci-evidence.tar.gz; do
            gh attestation verify "$artifact" \
              --bundle release-evidence/build-provenance.sigstore.json \
              --repo Alien6-Studio/outerspace-apizr \
              --signer-workflow Alien6-Studio/outerspace-apizr/.github/workflows/ci.yml \
              --source-digest "$GITHUB_SHA" --source-ref refs/heads/master
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-evidence
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
      - run: uv sync --locked
      - name: Inspect metadata and compare build checksums
        run: |
          uv run --locked python scripts/check_distribution.py dist --manifest verified.json
          cmp verified.json checksums/SHA256SUMS.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/outerspace-apizr/
    permissions:
      id-token: write
    steps:
      # No checkout, package installation or source execution in this job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          print-hash: true

  archive-evidence:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-evidence
          path: evidence
      - name: Preserve evidence beyond Actions retention
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Alien6-Studio/outerspace-apizr
        run: gh release upload "$GITHUB_REF_NAME" evidence/*
