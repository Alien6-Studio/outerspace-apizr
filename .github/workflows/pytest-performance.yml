name: Pytest performance comparison

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      - name: Prepare disposable SSH integration prerequisites
        if: runner.os == 'Linux'
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          sudo install -d -m 755 /run/sshd
      - run: uv sync --locked
      - name: Same-source serial and parallel full suites with all coverage gates
        run: uv run --locked python -m scripts.qualification.ci.benchmark_pytest --output "$RUNNER_TEMP/pytest-comparison"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-comparison-${{ matrix.os }}-3.14
          path: ${{ runner.temp }}/pytest-comparison
          if-no-files-found: error
          retention-days: 90
