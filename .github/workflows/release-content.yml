name: Release content
on:
  workflow_call:
    inputs:
      scope_ready:
        type: boolean
        default: false
      product:
        type: boolean
        default: true
      examples:
        type: boolean
        default: true
      candidate_artifact:
        type: string
        default: ''
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: Release content-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scope:
    if: ${{ !inputs.scope_ready }}
    uses: ./.github/workflows/change-scope.yml
  build:
    needs: scope
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Require the shared scope decision
        env:
          SCOPE_RESULT: ${{ inputs.scope_ready && 'success' || needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
      - run: uv sync --locked --group readme
      - name: Test release metadata, DCO and qualification routing
        run: uv run --locked pytest tests/test_release_metadata.py tests/test_ci_scope.py tests/test_dco.py tests/ci/test_release_consistency.py
      - name: Render and validate the four package descriptions
        run: uv run --locked python -m scripts.qualification.packaging.check_release_metadata --render "$RUNNER_TEMP/readme-previews"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-readme-previews
          path: ${{ runner.temp }}/readme-previews
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_artifact != '' && github.ref != 'refs/heads/master' && (inputs.scope_ready && format('{0}', inputs.examples) || needs.scope.outputs.examples) != 'false'
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/example-candidate
      - name: Prepare the installed candidate for executable journey fixtures
        if: github.ref != 'refs/heads/master' && (inputs.scope_ready && format('{0}', inputs.examples) || needs.scope.outputs.examples) != 'false'
        env:
          SHARED_CANDIDATE: ${{ inputs.candidate_artifact != '' }}
        run: |
          if test "$SHARED_CANDIDATE" = true; then
            uv run --locked python -m scripts.qualification.packaging.coordinated_distributions verify --candidate "$RUNNER_TEMP/example-candidate"
            mkdir "$RUNNER_TEMP/example-wheel"
            cp "$RUNNER_TEMP"/example-candidate/dist/outerspace_apizr-*.whl "$RUNNER_TEMP/example-wheel/"
          else
            uv build --wheel --out-dir "$RUNNER_TEMP/example-wheel"
          fi
          uv venv --python 3.14 "$RUNNER_TEMP/example-env"
          for wheel in "$RUNNER_TEMP"/example-wheel/*.whl; do
            uv pip install --python "$RUNNER_TEMP/example-env/bin/python" "${wheel}[http,mcp]"
          done
      - name: Qualify the product README and frozen journey fixtures
        if: github.ref != 'refs/heads/master' && (inputs.scope_ready && format('{0}', inputs.examples) || needs.scope.outputs.examples) != 'false'
        run: |
          uv run --locked python -m scripts.qualification.examples.smoke_readme "$RUNNER_TEMP/example-env/bin/apizr" --development --repository-refinement --example-python "$RUNNER_TEMP/example-env/bin/python"
          uv run --locked python -m scripts.qualification.examples.smoke_examples --python "$RUNNER_TEMP/example-env/bin/python" --output "$RUNNER_TEMP/example-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: executable-journey-evidence
          path: ${{ runner.temp }}/example-evidence/
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
