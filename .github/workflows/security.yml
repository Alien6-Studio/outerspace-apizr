name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.0'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group security
      - run: uv run --locked python scripts/check_dependency_sources.py
      - run: uv run --locked --group security python scripts/audit_dependencies.py --output dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 90

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          # GitHub default setup already publishes Python/Actions alerts for this repo.
          # Keep it enabled; a second CodeQL SARIF upload would be rejected.
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-python-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14
