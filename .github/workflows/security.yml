name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

# Supersede only earlier runs for the same PR. Other events get unique groups,
# so even pending manual, push and scheduled qualifications cannot cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml

  dependencies:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.product != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
      - name: Install exact client-collection lock without lifecycle scripts
        run: npm ci --prefix scripts/client_collection_tools --ignore-scripts --no-audit --no-fund
      - name: Audit all client-collection dependencies
        run: >-
          npm audit --prefix scripts/client_collection_tools --json
          --include=prod --include=dev --include=optional --include=peer
          --audit-level=moderate > node-dependency-audit.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group security
      - run: uv run --locked python scripts/check_dependency_sources.py
      - run: uv run --locked python scripts/check_dependency_licenses.py --output dependency-license-report.json
      - run: uv run --locked --group security python scripts/audit_dependencies.py --output dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: |
            dependency-audit.json
            dependency-license-report.json
            node-dependency-audit.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  codeql:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.product != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          # GitHub default setup already publishes Python/Actions alerts for this repo.
          # Keep it enabled; a second CodeQL SARIF upload would be rejected.
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-python-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
