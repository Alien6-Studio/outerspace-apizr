name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml

  dependencies:
    needs: scope
    if: always() && needs.scope.outputs.product != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
      - name: Install exact client-collection lock without lifecycle scripts
        run: npm ci --prefix scripts/client_collection_tools --ignore-scripts --no-audit --no-fund
      - name: Audit all client-collection dependencies
        run: >-
          npm audit --prefix scripts/client_collection_tools --json
          --include=prod --include=dev --include=optional --include=peer
          --audit-level=moderate > node-dependency-audit.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.0'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group security
      - run: uv run --locked python scripts/check_dependency_sources.py
      - run: uv run --locked python scripts/check_dependency_licenses.py --output dependency-license-report.json
      - run: uv run --locked --group security python scripts/audit_dependencies.py --output dependency-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit
          path: |
            dependency-audit.json
            dependency-license-report.json
            node-dependency-audit.json
          if-no-files-found: error
          retention-days: 90

  codeql:
    needs: scope
    if: always() && needs.scope.outputs.product != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          # GitHub default setup already publishes Python/Actions alerts for this repo.
          # Keep it enabled; a second CodeQL SARIF upload would be rejected.
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-python-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14
