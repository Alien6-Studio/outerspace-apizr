name: Website
on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    name: site-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - name: Verify the website environment is independent
        run: uv run --locked python -I -c 'import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ("apizr", "apizr_mcp", "apizr_oci", "apizr_attest"))'
      - name: Check DCO declarations
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test "$BASE" != 0000000000000000000000000000000000000000; then
            uv run --locked python scripts/check_dco.py --base "$BASE" --head "$GITHUB_SHA"
          fi
      - run: uv run --locked python scripts/check_dependency_sources.py
      - run: uv run --locked python scripts/check_dependency_licenses.py
      - name: Audit every locked dependency
        run: |
          mkdir -p "$RUNNER_TEMP/site-audit"
          uv export --locked --offline --no-emit-project --format pylock.toml --output-file "$RUNNER_TEMP/site-audit/pylock.toml" > /dev/null
          uv run --locked pip-audit --locked "$RUNNER_TEMP/site-audit" --strict --progress-spinner off
      - run: uv run --locked ruff check scripts tests academy
      - run: uv run --locked ruff format --check scripts tests academy
      - run: uv run --locked pytest -q
      - run: uv run --locked mkdocs build --strict
      - run: uv run --locked python scripts/check_html.py
      - name: Validate the retained website identity
        run: uv run --locked python scripts/check_site.py --check-local --source-commit "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: website-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip a superseded website deployment
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" --jq .sha)
          if test "$actual" = "$GITHUB_SHA"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Superseded website source $GITHUB_SHA; no deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.current.outputs.deploy == 'true'
        id: deployment
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.current.outputs.deploy == 'true'
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.current.outputs.deploy == 'true'
        with:
          name: github-pages
          path: artifact
      - name: Verify the exact public content after deployment
        if: steps.current.outputs.deploy == 'true'
        run: |
          uv sync --locked
          mkdir -p site
          uv run --locked python -c 'import tarfile; t=tarfile.open("artifact/artifact.tar"); t.extractall("site", filter="data")'
          uv run --locked python scripts/check_site.py --source-commit "$GITHUB_SHA" --timeout 600
