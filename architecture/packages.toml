# Frozen autonomous source imports; public facades preserve their runtime namespace.
[embedded_imports]
"capabilities/inspection.py" = ["apizr.capability_notebooks"]
"contracts/lowering.py" = ["apizr.contract_types"]
"execution/model.py" = ["apizr.inspection"]
"execution/planner.py" = ["apizr.inspection"]
"interfaces/model.py" = ["apizr.contract_types"]
"interfaces/planner.py" = ["apizr.inspection"]
"interfaces/schema.py" = ["apizr.contract_lowering"]
"oci/planner.py" = ["apizr.inspection"]
"readiness/model.py" = ["apizr.contract_types"]
"repository_interfaces/model.py" = ["apizr.application"]
"subprocess_guard/single.py" = ["apizr.inspection"]

[packages."plugins/artifacts"]
kind = "domain"
responsibility = "Plugin manifest identity, bounded verified wheel transfer, wheel validation and strict admitted requirements; no installation, activation or invocation."

[packages."plugins/preparation"]
kind = "domain"
responsibility = "Explicit target-aware dependency resolution, compatible-wheel selection, admitted-hash verification and atomic prepared profile publication; no installation or activation."

