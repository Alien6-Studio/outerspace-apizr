# Normative ownership inventory. See docs/architecture/code-organization.md.
schema_version = 1

[packages.""]
kind = "composition"
responsibility = "Package namespace and transitional public import surface."
modules = ["__init__.py"]

[packages."_prototypes"]
kind = "domain"
responsibility = "Private experiments; no supported public API or CLI contract."

[packages."capabilities"]
kind = "domain"
responsibility = "Typed, static Capability IR v1; independent of legacy generation."

[packages."ci"]
kind = "domain"
responsibility = "Forge-neutral static CI operations and their portable result contract."

[packages."cli"]
kind = "composition"
responsibility = "Compose command adapters and lazily dispatch console/Python entrypoints."
entrypoints = ["main", "_main"]
modules = ["__init__.py", "__main__.py", "completion.py", "completion_spec.py"]

[packages."cli/commands"]
kind = "domain"
responsibility = "CLI adapters: parse arguments, call core operations, present results."

[packages."client_collections"]
kind = "domain"
responsibility = "Deterministic client collections from verified retained REST bundles."

[packages."delivery_batch"]
kind = "domain"
responsibility = "Managed multi-destination delivery and explicit resume of an existing build."

[packages."execution"]
kind = "domain"
responsibility = "Explicit governed execution of trusted code in fresh local processes."

[packages."experiments"]
kind = "domain"
responsibility = "Content-addressed experiment contracts, bounded evidence producers, static inspection, explicit trusted local workload execution, immutable local history, deterministic evidence comparison and explicit Run binding to repository exposure; no remote tracking, registry or causal inference."

[packages."exposure"]
kind = "domain"
responsibility = "Exposure Plan v1: explicit publication decisions over static evidence."

[packages."extension_runtime"]
kind = "domain"
responsibility = "Explicit invocation of trusted extensions installed outside the core."

[packages."extensions"]
kind = "legacy"
responsibility = "Historical generation step engine and its adapter registrations. Scope: extensions."

[packages."extensions/core"]
kind = "legacy"
responsibility = "Historical generation step engine and its adapter registrations. Scope: extensions/core."

[packages."extensions/plugins"]
kind = "legacy"
responsibility = "Historical generation step engine and its adapter registrations. Scope: extensions/plugins."

[packages."generators"]
kind = "composition"
responsibility = "Compose static REST and MCP interface generators."
modules = ["__init__.py", "notebooks.py"]

[packages."generators/mcp"]
kind = "domain"
responsibility = "Static MCP Tools compiler; importing it does not import the MCP SDK."

[packages."generators/rest"]
kind = "domain"
responsibility = "Static REST/OpenAPI v1 consumer of Capability IR and Readiness."

[packages."git_source"]
kind = "domain"
responsibility = "Static HTTPS/SSH Git input; no plugins or optional dependencies."

[packages."governed"]
kind = "domain"
responsibility = "Opt-in transport integration; direct generators retain their original bytes."

[packages."governed_oci"]
kind = "domain"
responsibility = "Explicit OCI transport bridge; local-process v1 is unchanged."

[packages."governed_repository"]
kind = "domain"
responsibility = "Governed repository bridge, independent from direct and single-source contracts."

[packages."graph"]
kind = "domain"
responsibility = "Conservative static relationships over a digest-bound Capability Catalog."

[packages."interfaces"]
kind = "domain"
responsibility = "Framework-independent interface contracts shared by generated backends."

[packages."modules"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules."

[packages."modules/code_analyzr"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules/code_analyzr."

[packages."modules/code_analyzr/analyzr"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules/code_analyzr/analyzr."

[packages."modules/code_analyzr/analyzr/ast_node"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules/code_analyzr/analyzr/ast_node."

[packages."modules/dockerizr"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules/dockerizr."

[packages."modules/dockerizr/generator"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules/dockerizr/generator."

[packages."modules/fast_apizr"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules/fast_apizr."

[packages."modules/fast_apizr/generator"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules/fast_apizr/generator."

[packages."modules/fast_apizr/generator/analyzr"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules/fast_apizr/generator/analyzr."

[packages."modules/notebook_transformr"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules/notebook_transformr."

[packages."modules/notebook_transformr/transformr"]
kind = "legacy"
responsibility = "Historical notebook/script transformation pipeline. Scope: modules/notebook_transformr/transformr."

[packages."oci"]
kind = "domain"
responsibility = "OCI-container execution is independent from transport generation."

[packages."onboarding"]
kind = "domain"
responsibility = "Safe local project setup and read-only preparation diagnostics."

[packages."plugins"]
kind = "composition"
responsibility = "Compose independent core plugin lifecycle domains without activation."
modules = ["__init__.py"]

[packages."plugins/catalog"]
kind = "domain"
responsibility = "Versioned plugin metadata and explicit preparation for offline project sync."

[packages."plugins/local"]
kind = "domain"
responsibility = "Local installed store lifecycle: install, explicitly activate, invoke and uninstall."

[packages."plugins/lock"]
kind = "domain"
responsibility = "Explicit, read-only artifact validation and deterministic project locks."

[packages."plugins/sync"]
kind = "domain"
responsibility = "Explicit, additive synchronization of portable project plugin locks."

[packages."plugins/update"]
kind = "domain"
responsibility = "Explicit locked updates, with optional compare-and-select activation."

[packages."readiness"]
kind = "domain"
responsibility = "Separate static readiness policy for Capability IR v1."

[packages."repository"]
kind = "domain"
responsibility = "Static repository inventory; no graph, imports or execution of user code."

[packages."repository_execution"]
kind = "domain"
responsibility = "Fresh-worker execution for the explicit repository source universe."

[packages."repository_interfaces"]
kind = "domain"
responsibility = "Direct repository interfaces consuming explicit Exposure Plans."

[packages."repository_readiness"]
kind = "domain"
responsibility = "Static repository exposure/governance evidence; no runtime guarantees."

[packages."repository_views"]
kind = "domain"
responsibility = "Pure, bounded navigation of complete canonical repository evidence."

[packages."subprocess_guard"]
kind = "domain"
responsibility = "Opt-in Linux OCI subprocess prohibition; existing allow runtimes stay frozen."

[packages."workspace"]
kind = "domain"
responsibility = "Explicit project declarations, operator preferences and bounded file access."

[packages."contracts"]
kind = "domain"
responsibility = "Portable validated source, interface and delivery contracts."

[packages."environment"]
kind = "domain"
responsibility = "Interpreter targets and explicit optional workflow requirements."

[packages."legacy"]
kind = "legacy"
responsibility = "Historical generation entrypoints, configuration and prompt resources."

