# Normative ownership inventory. See docs/architecture/code-organization.md.
schema_version = 1

[packages.""]
kind = "composition"
responsibility = "Inert package namespace; implementations belong to declared domains."
modules = ["__init__.py"]

[packages."_prototypes"]
kind = "domain"
responsibility = "Private experiments; no supported public API or CLI contract."

[packages."capabilities"]
kind = "domain"
responsibility = "Typed, static Capability IR v1; independent of legacy generation."

[packages."ci"]
kind = "domain"
responsibility = "Forge-neutral static CI operations and their portable result contract."

[packages."cli"]
kind = "composition"
responsibility = "Compose command adapters and lazily dispatch console/Python entrypoints."
entrypoints = ["main", "_main"]
modules = ["__init__.py", "__main__.py", "completion.py", "completion_spec.py"]

[packages."cli/commands"]
kind = "domain"
responsibility = "CLI adapters: parse arguments, call core operations, present results."

[packages."client_collections"]
kind = "domain"
responsibility = "Deterministic client collections from verified retained REST bundles."

[packages."delivery_batch"]
kind = "domain"
responsibility = "Managed multi-destination delivery and explicit resume of an existing build."

[packages."execution"]
kind = "domain"
responsibility = "Explicit governed execution of trusted code in fresh local processes."

[packages."experiments"]
kind = "domain"
responsibility = "Content-addressed experiment contracts, bounded evidence producers, static inspection, explicit trusted local workload execution, immutable local history, deterministic evidence comparison and explicit Run binding to repository exposure; no remote tracking, registry or causal inference."

[packages."tracking"]
kind = "domain"
responsibility = "In-process experiment-tracking SDK sessions, bounded observation of existing kernel executions and explicit logging, publishing canonical experiment evidence through experiments; no execution isolation, CLI, plugin management or scientific-library dependency."
allowed_internal_imports = ["apizr.tracking", "apizr.experiments", "apizr.scientific_providers.contracts", "apizr.telemetry.collection"]
allowed_external_imports = ["pydantic"]

[packages."telemetry"]
kind = "domain"
responsibility = "Closed identifier-free usage-report contracts, explicit per-user boolean consent, bounded process-local counters and exact local preview; no experiment/store access, event persistence or network transmission."
allowed_internal_imports = ["apizr.telemetry", "apizr.contracts.json_budget"]
allowed_external_imports = ["pydantic"]

[packages."scientific_providers"]
kind = "composition"
responsibility = "Compose scientific provider contracts, explicit selection and the official built-in source recognizers; retain admission compatibility exports."
modules = ["__init__.py", "admission.py"]

[packages."scientific_providers/contracts"]
kind = "domain"
responsibility = "Static scientific provider and in-process SDK adapter contracts, bounded candidate admission and payloads over the existing extension protocol; no discovery, scientific-library imports, workload execution or direct evidence-store publication."
allowed_internal_imports = ["apizr.capabilities.types", "apizr.experiments.model", "apizr.experiments.inputs", "apizr.experiments.metrics", "apizr.experiments.outputs", "apizr.experiments.randomness", "apizr.experiments.provider_source", "apizr.contracts.distribution", "apizr.contracts.json", "apizr.extension_runtime.protocol"]
allowed_external_imports = ["pydantic"]

[packages."scientific_providers/builtin"]
kind = "domain"
responsibility = "Official default source-only scientific API recognition and occurrence locations, shipped in the core wheel; no scientific imports, file observations, workload execution or store publication."
allowed_internal_imports = ["apizr.experiments.model", "apizr.experiments.inputs", "apizr.experiments.metrics", "apizr.experiments.outputs", "apizr.experiments.randomness", "apizr.experiments.provider_source", "apizr.scientific_providers.contracts"]
allowed_external_imports = ["pydantic"]

[packages."scientific_providers/selection"]
kind = "domain"
responsibility = "Explicit ordered scientific provider selection, descriptor/version admission and bounded invocation of trusted installed extensions; no automatic discovery, scientific imports, store publication or evidence comparison."
allowed_internal_imports = ["apizr.contracts.json", "apizr.experiments.provider_source", "apizr.extension_runtime", "apizr.plugins.artifacts.models", "apizr.plugins.local.activation", "apizr.scientific_providers.contracts", "apizr.scientific_providers.builtin"]
allowed_external_imports = ["pydantic"]

[packages."editor_contracts"]
kind = "domain"
responsibility = "Versioned editor capability, request, response and diagnostic contracts over existing engine evidence; no editor UI or transport implementation."
allowed_internal_imports = ["apizr.editor_contracts", "apizr.experiments", "apizr.scientific_providers", "apizr.exposure"]
allowed_external_imports = ["pydantic"]

[packages."exposure"]
kind = "domain"
responsibility = "Exposure Plan v1: explicit publication decisions over static evidence."

[packages."extension_runtime"]
kind = "domain"
responsibility = "Explicit invocation of trusted extensions installed outside the core."

[packages."generators"]
kind = "composition"
responsibility = "Compose static REST and MCP interface generators."
modules = ["__init__.py", "notebooks.py"]

[packages."generators/mcp"]
kind = "domain"
responsibility = "Static MCP Tools compiler; importing it does not import the MCP SDK."

[packages."generators/rest"]
kind = "domain"
responsibility = "Static REST/OpenAPI v1 consumer of Capability IR and Readiness."

[packages."git_source"]
kind = "domain"
responsibility = "Static HTTPS/SSH Git input; no plugins or optional dependencies."

[packages."governed"]
kind = "domain"
responsibility = "Opt-in transport integration; direct generators retain their original bytes."

[packages."governed_oci"]
kind = "domain"
responsibility = "Explicit OCI transport bridge; local-process v1 is unchanged."

[packages."governed_repository"]
kind = "domain"
responsibility = "Governed repository bridge, independent from direct and single-source contracts."

[packages."graph"]
kind = "domain"
responsibility = "Conservative static relationships over a digest-bound Capability Catalog."

[packages."interfaces"]
kind = "domain"
responsibility = "Framework-independent interface contracts shared by generated backends."

[packages."notebooks"]
kind = "domain"
responsibility = "Bounded non-executing notebook export, cell selection and explicit script formatting."

[packages."oci"]
kind = "domain"
responsibility = "OCI-container execution is independent from transport generation."

[packages."onboarding"]
kind = "domain"
responsibility = "Safe local project setup and read-only preparation diagnostics."

[packages."plugins"]
kind = "composition"
responsibility = "Compose independent core plugin lifecycle domains without activation."
modules = ["__init__.py"]

[packages."plugins/catalog"]
kind = "domain"
responsibility = "Versioned plugin metadata and explicit preparation for offline project sync."

[packages."plugins/local"]
kind = "domain"
responsibility = "Local installed store lifecycle: install, explicitly activate, invoke and uninstall."

[packages."plugins/lock"]
kind = "domain"
responsibility = "Explicit, read-only artifact validation and deterministic project locks."

[packages."plugins/sync"]
kind = "domain"
responsibility = "Explicit, additive synchronization of portable project plugin locks."

[packages."plugins/update"]
kind = "domain"
responsibility = "Explicit locked updates, with optional compare-and-select activation."

[packages."readiness"]
kind = "domain"
responsibility = "Separate static readiness policy for Capability IR v1."

[packages."repository"]
kind = "domain"
responsibility = "Static repository inventory; no graph, imports or execution of user code."

[packages."repository_execution"]
kind = "domain"
responsibility = "Fresh-worker execution for the explicit repository source universe."

[packages."repository_interfaces"]
kind = "domain"
responsibility = "Direct repository interfaces consuming explicit Exposure Plans."

[packages."repository_readiness"]
kind = "domain"
responsibility = "Static repository exposure/governance evidence; no runtime guarantees."

[packages."repository_views"]
kind = "domain"
responsibility = "Pure, bounded navigation of complete canonical repository evidence."

[packages."subprocess_guard"]
kind = "domain"
responsibility = "Opt-in Linux OCI subprocess prohibition; existing allow runtimes stay frozen."

[packages."workspace"]
kind = "domain"
responsibility = "Explicit project declarations, operator preferences and bounded file access."

[packages."contracts"]
kind = "domain"
responsibility = "Portable validated source, interface and delivery contracts."

[packages."environment"]
kind = "domain"
responsibility = "Interpreter targets and explicit optional workflow requirements."

[root_debt]

[plugin_dependencies]
artifacts = []
local = ["artifacts"]
lock = ["artifacts", "local"]
catalog = ["artifacts", "lock"]
sync = ["artifacts", "local", "lock"]
update = ["artifacts", "local", "lock", "sync"]
preparation = ["artifacts", "lock"]

[packages."plugins/artifacts"]
kind = "domain"
responsibility = "Plugin manifest identity, bounded verified wheel transfer, wheel validation and strict admitted requirements; no installation, activation or invocation."

[packages."plugins/preparation"]
kind = "domain"
responsibility = "Explicit target-aware dependency resolution, compatible-wheel selection, admitted-hash verification and atomic prepared profile publication; no installation or activation."


# Historical forwarding modules were removed in 0.4.6. This inventory must stay empty.
[compatibility]
