# Normative qualification ownership. See docs/contributing/qualification-scripts.md.
schema_version = 1

[groups."ci"]
kind = "domain"
responsibility = "Repository policy, dependency admission, structural/security gates and measured CI behavior."
prefix = "scripts/qualification/ci/"

[groups."docs"]
kind = "domain"
responsibility = "Documentation construction, exact publication identity and executable reader examples."
prefix = "scripts/qualification/docs/"

[groups."fixtures"]
kind = "domain"
responsibility = "Disposable native protocol, signing, SSH/TLS, registry and isolation fixtures."
prefix = "scripts/qualification/fixtures/"

[groups."packaging"]
kind = "domain"
responsibility = "Coordinated distributions, installed environments, Homebrew, registry metadata and governed release evidence."
prefix = "scripts/qualification/packaging/"

[groups."repository"]
kind = "domain"
responsibility = "Installed Git source acquisition, provenance and transport qualification."
prefix = "scripts/qualification/repository/"

[groups."extensions"]
kind = "domain"
responsibility = "Plugin preparation, catalogue/profile installation, synchronization, update and cleanup qualification."
prefix = "scripts/qualification/extensions/"

[groups."interfaces"]
kind = "domain"
responsibility = "Installed MCP/REST clients, protocol schemas, native collections and onboarding qualification."
prefix = "scripts/qualification/interfaces/"

[files."scripts/qualification/interfaces/telemetry_contract.py"]
group = "interfaces"
role = "fixture"
kind = "implementation"
gate = "Export the telemetry schema and qualify a disposable bounded loopback-only receiver; never contact production."
standalone = false
workflows = []
ci_blocking = false
evidence = ["stdout/stderr (manual developer command)"]

[groups."experiments"]
kind = "domain"
responsibility = "Scientific contracts, tracked runs, history, notebooks, providers and the installed data-scientist journey."
prefix = "scripts/qualification/experiments/"

[groups."delivery"]
kind = "domain"
responsibility = "Explicit operator authority, artifact/image delivery, Attest receipts and admission proofs."
prefix = "scripts/qualification/delivery/"

[groups."mcp-distribution"]
kind = "domain"
responsibility = "Named helpers for read-only official MCP distribution and external-index verification."
prefix = "scripts/mcp_distribution/"

[groups."client-tools"]
kind = "domain"
responsibility = "Exact native vendor-tool manifests and compatibility checks for REST client collections."
prefix = "scripts/client_collection_tools/"

[groups."entrypoints"]
kind = "composition"
responsibility = "Compose qualification namespaces; compatibility CLIs delegate to their declared domain."
prefix = "scripts/"
namespaces = ["scripts/__init__.py", "scripts/qualification/__init__.py"]

