version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: "0.4.6"
    schedule:
      interval: weekly
    ignore:
      # Compiler migrations and the supported Node API baseline are reviewed separately.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      build-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "0.4.6"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
