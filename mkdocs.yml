site_name: OuterSpace Apizr
site_url: https://apizr.outerspace.sh
site_author: Ludovic FERNANDEZ, Alien6
site_description: >-
  Open-source capability compiler for Python codebases.

# Repository
repo_name: alien6-studio/outerspace-apizr
repo_url: https://github.com/alien6-studio/outerspace-apizr

# Copyright
copyright: >-
  Copyright &copy; 2023–2026 Alien6 ·
  <a href="#__consent">Cookie settings</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.png
  icon:
    repo: fontawesome/brands/github-alt
  palette:
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/images/favicon.png
  features:
    - content.code.copy
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html

extra:
  generator: false
  consent:
    title: Cookie consent
    description: >-
      Optional GitHub requests show repository statistics. They are off until
      you choose them. You can reject them or change your choice at any time.
    actions:
      - accept
      - reject
      - manage
    cookies:
      github:
        name: GitHub repository statistics
        checked: false

validation:
  links:
    not_found: warn
    anchors: warn

extra_css:
  - assets/stylesheets/branding.css
extra_javascript:
  - assets/javascripts/video.js

