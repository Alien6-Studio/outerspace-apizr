site_name: OuterSpace Apizr
site_url: https://apizr.outerspace.sh
site_author: Ludovic FERNANDEZ, Alien6
site_description: >-
  OuterSpace Apizr

# Repository
repo_name: alien6-studio/outerspace-apizr
repo_url: https://github.com/alien6-studio/outerspace-apizr

# Copyright
copyright: Copyright &copy; 2023 Alien6

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.png
  icon:
    repo: fontawesome/brands/github-alt
  palette:
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
    favicon: assets/images/logo.png
  features:
    - announce.dismiss
    - announce.hide
    # - content.action.edit
    # - content.action.view
    # - content.code.annotate
    - content.code.copy
    # - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.prune
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    #- toc.integrate
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html

extra:
  generator: false
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    actions:
      - accept
  analytics:
    provider: google
    property: G-P3BHZB2FVP

extra_css:
  - assets/stylesheets/extra.css

# Organize by reader task; keep published page paths stable.
nav:
  - Home: index.md
  - Guides:
      - Start here: getting-started/introduction.md
      - Inspect source without running it: getting-started/user-guide/inspect.md
      - Generate a REST interface: getting-started/user-guide/rest.md
      - Generate an MCP server: getting-started/user-guide/mcp.md
      - Execute trusted code locally: getting-started/user-guide/execute.md
      - Generate a legacy API and container: getting-started/user-guide/apizr.md
      - Migrate from 0.1.x: getting-started/developer-guide/releases.md
  - Reference:
      - Overview: reference/index.md
      - Standalone commands:
          - Analyze Python: getting-started/user-guide/code-analyzr.md
          - Generate FastAPI: getting-started/user-guide/fast-apizr.md
          - Generate Docker files: getting-started/user-guide/dockerizr.md
      - Pipeline components:
          - Notebook conversion: modules/notebook-transformr.md
          - Python analysis: modules/code-analyzr.md
          - FastAPI generation: modules/fast-apizr.md
          - Docker generation: modules/dockerizr.md
      - HTTP generation service:
          - Service and project upload: apis/apizr-api.md
          - Python analysis endpoint: apis/code-analyzr-api.md
          - FastAPI generation endpoint: apis/fast-apizr-api.md
          - Notebook conversion endpoint: apis/notebook-transformr-api.md
          - Docker generation endpoints: apis/dockerizr-api.md
      - Architecture and contracts:
          - Capability IR v1: architecture/capability-ir-v1.md
          - Static readiness v1: architecture/capability-readiness-v1.md
          - REST generator v1: architecture/rest-generator-v1.md
          - MCP generator v1: architecture/mcp-generator-v1.md
          - Execution Policy v1: architecture/execution-policy-v1.md
          - Governed REST and MCP: architecture/governed-transport-runtime-v1.md
          - Legacy behavior contract: architecture/legacy-behavior-contract.md
          - Artifact principles: architecture/artifact-principles.md
          - Security baseline: architecture/security-baseline.md
  - Contributing:
      - Overview: about/CONTRIBUTING.md
      - Development and checks: getting-started/developer-guide/setup.md
      - Publish a release: contributing/releases.md
      - Engineering archive:
          - Read these records: architecture/records.md
          - Original 0.2 baseline: architecture/0.2-baseline.md
          - Foundation verification: architecture/0.2-hardening.md
          - Historical dependency audit: architecture/foundation-security-audit.md
          - Capability IR verification: architecture/capability-ir-v1-verification.md
      - Code of conduct: about/CODE_OF_CONDUCT.md
      - License: about/LICENSE.md
