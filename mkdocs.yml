site_name: OuterSpace Apizr
site_url: https://apizr.outerspace.sh
site_author: Ludovic FERNANDEZ, Alien6
site_description: >-
  Inspect Python code, share selected functions through REST or MCP, and record or compare experiments when useful.

hooks:
  - scripts/build.py

# Repository
repo_name: alien6-studio/outerspace-apizr
repo_url: https://github.com/alien6-studio/outerspace-apizr

# Copyright
copyright: >-
  Copyright &copy; 2023–2026 Alien6 ·
  <a href="#__consent">Cookie settings</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.png
  icon:
    repo: fontawesome/brands/github-alt
  palette:
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # System fonts avoid third-party requests before consent or video playback.
  font: false
  favicon: assets/images/favicon.png
  features:
    - content.code.copy
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html

extra:
  generator: false
  analytics:
    provider: google
    property: G-MX4P2Y5EG4
  consent:
    title: Cookie consent
    description: >-
      Optional Google Analytics cookies measure documentation visits. Optional
      GitHub requests show repository statistics. Optional Product Hunt requests
      display the homepage badge. These stay off until you choose them. You can reject them or change your choice at any time.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics:
        name: Google Analytics
        checked: false
      github:
        name: GitHub repository statistics
        checked: false
      producthunt:
        name: Product Hunt badge
        checked: false

validation:
  links:
    not_found: warn
    anchors: warn

extra_css:
  - assets/stylesheets/branding.css
extra_javascript:
  - assets/javascripts/video.js
  - assets/javascripts/feedback.js

