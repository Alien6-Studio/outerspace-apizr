[project]
name = "apizr-attest"
version = "0.4.0"
description = "Optional Continuum Attest receipts for verified Apizr OCI deliveries"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["apizr-oci==0.4.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apizr_attest"]

[tool.hatch.build.targets.wheel.force-include]
"apizr-extension.json" = "apizr-extension.json"

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/apizr-extension.json", "/README.md", "/LICENSE"]
