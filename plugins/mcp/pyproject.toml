[project]
name = "outerspace-apizr-mcp"
version = "0.4.0.1"
description = "Optional local stdio MCP server for read-only Apizr analysis and planning"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["outerspace-apizr==0.4.0.1", "mcp>=2.2,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apizr_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"apizr-extension.json" = "apizr-extension.json"

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/apizr-extension.json", "/README.md", "/LICENSE"]
