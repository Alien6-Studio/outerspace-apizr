[project]
name = "outerspace-apizr"
version = "0.2.0"
description = "Turn Python functions and Jupyter notebooks into containerized FastAPI applications."
requires-python = ">=3.8,<3.15"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Ludovic FERNANDEZ", email = "ludovic.fernandez@alien6.com"},
  {name = "Oussama HADJ AISSA", email = "oussama.h.aissa@alien6.com"},
]
dependencies = [
  "nbconvert>=7.16,<8",
  "ipython>=7.34,<10",
  "black>=24.8,<27",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.18,<1",
  "PyYAML>=6.0.2,<7",
  "questionary>=2.0.1,<3",
  "packaging>=24,<27",
  "typing-extensions>=4.12,<5",
  "importlib-metadata>=6.8,<9; python_version < '3.10'",
  "stdlib-list>=0.10,<1; python_version < '3.10'",
  "astunparse>=1.6.3,<2; python_version < '3.9'",
]

[project.scripts]
apizr = "apizr.main:main"

[project.urls]
Repository = "https://github.com/Alien6-Studio/outerspace-apizr"
Website = "https://apizr.outerspace.sh"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "pyright>=1.1.400,<2", "pre-commit>=3.5,<5", "importlib-metadata>=6.8,<9", "stdlib-list>=0.10,<1", "astunparse>=1.6.3,<2"]
security = ["pip-audit>=2.9,<3"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "plantuml-markdown>=3.10,<4"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apizr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov-config=pyproject.toml"

[tool.ruff]
target-version = "py38"
extend-exclude = ["tests/fixtures", "overrides"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "PIE", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.uv.dependency-groups]
security = {requires-python = ">=3.11"}

[tool.pyright]
include = ["src/apizr", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.8"

[tool.coverage.run]
source = ["apizr"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
# Below the recorded 55.90% branch-aware baseline; includes legacy modules.
fail_under = 55

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations are evaluated defaults by design.
extend-immutable-calls = ["fastapi.File"]
