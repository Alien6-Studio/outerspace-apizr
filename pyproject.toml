[project]
name = "outerspace-apizr"
version = "0.3.0.dev0"
description = "Compile Python codebases into discoverable, typed and governable capabilities."
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["python", "capabilities", "static-analysis", "rest", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
]
authors = [
  {name = "Ludovic FERNANDEZ", email = "ludovic.fernandez@alien6.com"},
  {name = "Oussama HADJ AISSA", email = "oussama.h.aissa@alien6.com"},
]
dependencies = [
  "nbconvert>=7.17.1,<8",
  "ipython>=9,<10",
  "black>=26.3.1,<27",
  "fastapi>=0.141,<1",
  # FastAPI still permits vulnerable Starlette; this is a security floor, not a pin.
  "starlette>=1.3.1",
  "pydantic>=2.12,<3",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.31,<1",
  "PyYAML>=6.0.2,<7",
  "questionary>=2.0.1,<3",
  "packaging>=24,<27",
]

[project.scripts]
apizr = "apizr.cli:main"

[project.urls]
Repository = "https://github.com/Alien6-Studio/outerspace-apizr"
Documentation = "https://apizr.outerspace.sh/"
Issues = "https://github.com/Alien6-Studio/outerspace-apizr/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pyright>=1.1.400,<2",
    "pre-commit>=4,<5",
    "hypothesis>=6.140,<7",
    "mcp>=2.2,<3",
    "pytest-timeout>=2.4,<3",
]
security = ["pip-audit>=2.9,<3"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "plantuml-markdown>=3.10,<4"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apizr"]

[tool.hatch.build.targets.sdist]
include = ["/src/apizr", "/pyproject.toml", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov-config=pyproject.toml"

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests/fixtures", "overrides"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "PIE", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pyright]
include = ["src/apizr", "scripts"]
typeCheckingMode = "standard"
strict = ["src/apizr/repository_interfaces", "src/apizr/exposure", "src/apizr/exposure_cli.py", "src/apizr/capabilities", "src/apizr/readiness", "src/apizr/generators/rest", "src/apizr/interfaces", "src/apizr/generators/mcp", "src/apizr/execution", "src/apizr/governed", "src/apizr/oci", "src/apizr/governed_oci", "src/apizr/repository", "src/apizr/scan_cli.py", "src/apizr/graph", "src/apizr/graph_cli.py", "src/apizr/repository_readiness", "src/apizr/repository_readiness_cli.py", "src/apizr/readiness_cli.py", "src/apizr/repository_cli.py"]
pythonVersion = "3.11"

[tool.coverage.run]
source = ["apizr"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
# Release CI measured 90.65–90.99% across Python 3.11–3.14, including legacy.
fail_under = 90

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations are evaluated defaults by design.
extend-immutable-calls = ["fastapi.File"]
