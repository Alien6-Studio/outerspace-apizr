[project]
name = "outerspace-apizr"
version = "0.4.4"
description = "Compile Python codebases into discoverable, typed and governable capabilities."
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["python", "capabilities", "static-analysis", "rest", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
]
authors = [
  {name = "Ludovic FERNANDEZ", email = "ludovic.fernandez@alien6.com"},
  {name = "Oussama HADJ AISSA", email = "oussama.h.aissa@alien6.com"},
]
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
clients = ["PyYAML>=6.0.2,<7"]
notebook = [
  "nbconvert>=7.17.1,<8",
  "ipython>=9,<10",
  "black>=26.3.1,<27",
]
http = [
  "fastapi>=0.141,<1",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.31,<1",
]
mcp = [
  "mcp>=2.2,<3",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.30,<1",
]
legacy = [
  "nbconvert>=7.17.1,<8",
  "ipython>=9,<10",
  "black>=26.3.1,<27",
  "fastapi>=0.141,<1",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.31,<1",
  "PyYAML>=6.0.2,<7",
  "questionary>=2.0.1,<3",
  "packaging>=24,<27",
]

[project.scripts]
apizr = "apizr.cli:main"

[project.urls]
Repository = "https://github.com/Alien6-Studio/outerspace-apizr"
Documentation = "https://apizr.outerspace.sh/"
Issues = "https://github.com/Alien6-Studio/outerspace-apizr/issues"

[dependency-groups]
dev = [
    # Validation exercises every optional workflow; base installations stay minimal.
    "nbconvert>=7.17.1,<8",
    "ipython>=9,<10",
    "black>=26.3.1,<27",
    "fastapi>=0.141,<1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.31,<1",
    "PyYAML>=6.0.2,<7",
    "questionary>=2.0.1,<3",
    "packaging>=24,<27",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pyright>=1.1.400,<2",
    "pre-commit>=4,<5",
    "hypothesis>=6.140,<7",
    "mcp>=2.2,<3",
    "pytest-timeout>=2.4,<3",
    "jsonschema>=4.23,<5",
]
security = ["pip-audit>=2.9,<3"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "plantuml-markdown>=3.10,<4"]
homebrew-build = ["hatchling==1.32.4"]

[build-system]
requires = ["hatchling<2,>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apizr"]

[tool.hatch.build.targets.sdist]
include = ["/src/apizr", "/pyproject.toml", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov-config=pyproject.toml"

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests/fixtures", "overrides"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "PIE", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pyright]
include = ["src/apizr", "scripts", "plugins/oci/src", "plugins/attest/src", "plugins/mcp/src"]
extraPaths = ["src", "plugins/oci/src", "plugins/attest/src", "plugins/mcp/src"]
typeCheckingMode = "standard"
strict = ["src/apizr/repository_views", "plugins/mcp/src/apizr_mcp/model.py", "src/apizr/contract_types.py", "src/apizr/contract_lowering.py", "src/apizr/delivery.py", "src/apizr/distribution_identity.py", "src/apizr/operator_policy.py", "src/apizr/publication_contracts.py", "src/apizr/git_source", "src/apizr/cli/commands/git_source.py", "src/apizr/plugins/local", "src/apizr/cli/commands/plugins.py", "src/apizr/extension_runtime", "src/apizr/project.py", "src/apizr/compiler.py", "src/apizr/subprocess_guard", "src/apizr/repository_execution", "src/apizr/governed_repository", "src/apizr/repository_interfaces", "src/apizr/exposure", "src/apizr/cli/commands/exposure.py", "src/apizr/capabilities", "src/apizr/readiness", "src/apizr/generators/rest", "src/apizr/interfaces", "src/apizr/generators/mcp", "src/apizr/execution", "src/apizr/governed", "src/apizr/oci", "src/apizr/governed_oci", "src/apizr/repository", "src/apizr/cli/commands/scan.py", "src/apizr/graph", "src/apizr/cli/commands/graph.py", "src/apizr/repository_readiness", "src/apizr/cli/commands/repository_readiness.py", "src/apizr/cli/commands/readiness.py", "src/apizr/cli/commands/repository.py"]
pythonVersion = "3.11"

[tool.coverage.run]
source = ["apizr", "apizr_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
# Release CI measured 90.65–90.99% across Python 3.11–3.14, including legacy.
fail_under = 90

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations are evaluated defaults by design.
extend-immutable-calls = ["fastapi.File"]
