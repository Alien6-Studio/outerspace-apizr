[project]
name = "apizr-documentation"
version = "0.0.0"
description = "Independent tooling for the Apizr documentation and site."
requires-python = ">=3.11,<3.15"
dependencies = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "plantuml-markdown>=3.10,<4",
    "pytest>=9.0.3,<10",
    "ruff>=0.11,<1",
    "pre-commit>=4,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
